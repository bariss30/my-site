];

const tagLabel={concept:"Kavram",apply:"Uygulama",analyze:"Analiz",mixed:"Karma",tf:"Matematiksel",idf:"Matematiksel",tfidf:"Matematiksel",jaccard:"Matematiksel",w2v:"Matematiksel",cosine:"Matematiksel"};
const tagClass={concept:"tag-concept",apply:"tag-apply",analyze:"tag-analyze",mixed:"tag-mixed",tf:"tag-analyze",idf:"tag-analyze",tfidf:"tag-analyze",jaccard:"tag-analyze",w2v:"tag-analyze",cosine:"tag-analyze"};
const letters=["A","B","C","D"];

// Durum değişkenleri
let currentQuestions = []; 
let userAnswers = [];
let reviewList = JSON.parse(localStorage.getItem('tm_review_list')) || [];
let activeSet = 1; 
let isReviewMode = false;

// Sayfa ilk yüklendiğinde çalışacak ana motor
function init(){
    buildSetButtons();
    updateReviewCountDisplay();
    loadSet(1);
}

// SORU SAYISINA GÖRE DİNAMİK BUTON ÜRETİCİ (CRITICAL FOR 140 QUESTIONS)
function buildSetButtons(){
    const grid = document.getElementById("dynamic-set-grid");
    grid.innerHTML = "";
    
    // Toplam soru sayısına göre kaç tane 20'lik set çıktığını hesapla
    const setLength = 20;
    const totalSets = Math.ceil(allQuestions.length / setLength);
    
    for(let i = 1; i <= totalSets; i++) {
        const btn = document.createElement("div");
        btn.className = "set-btn";
        btn.id = `btn-set${i}`;
        
        const startNum = (i - 1) * setLength + 1;
        const endNum = Math.min(i * setLength, allQuestions.length);
        
        btn.textContent = `Set ${i} (${startNum}-${endNum})`;
        btn.onclick = () => loadSet(i);
        grid.appendChild(btn);
    }
}

// Seçilen seti yükleme fonksiyonu (20'şerli dinamik render)
function loadSet(setNum){
    isReviewMode = false;
    activeSet = setNum;
    
    // Aktif buton görsel güncellemesi
    document.querySelectorAll('.set-btn').forEach(b => b.classList.remove('active'));
    const currentActiveBtn = document.getElementById('btn-set'+setNum);
    if(currentActiveBtn) currentActiveBtn.classList.add('active');

    const startIdx = (setNum - 1) * 20;
    const endIdx = startIdx + 20;
    currentQuestions = allQuestions.slice(startIdx, endIdx);
    
    // Cevap dizisini aktif set uzunluğuna göre ilklendir
    userAnswers = new Array(currentQuestions.length).fill(-1);
    
    calculateAndShowWeights();
    renderQuestions();
    updateStats();
}

// Tekrar listesini yükleme fonksiyonu
function loadReviewSet(){
    if(reviewList.length === 0){
        alert("Tekrar listeniz şu anda boş! Yapamadığınız sorular otomatik olarak buraya eklenir.");
        return;
    }
    isReviewMode = true;
    document.querySelectorAll('.set-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('btn-set-review').classList.add('active');

    // Kaydedilen global indekslere göre soruları çek
    currentQuestions = reviewList.map(globalIdx => allQuestions[globalIdx]).filter(q => q !== undefined);
    userAnswers = new Array(currentQuestions.length).fill(-1);

    calculateAndShowWeights();
    renderQuestions();
    updateStats();
}

// Soru setindeki soru tiplerinin ağırlığını hesaplama
function calculateAndShowWeights(){
    const counts = {concept:0, apply:0, analyze:0, mixed:0};
    
    // Matematiksel alt tagları analiz/uygulama havuzuna dahil etmek veya karma saymak için normalize edelim
    currentQuestions.forEach(q => { 
        let tag = q.tag;
        if(["tf","idf","tfidf","jaccard","w2v","cosine"].includes(tag)) {
            tag = "apply"; // Formül içeren hesaplamalı sorular uygulama/analiz ağırlıklıdır
        }
        if(counts[tag]!==undefined) counts[tag]++; 
    });
    
    const total = currentQuestions.length;
    
    let html = `<table class="weight-table">
        <tr><th>Soru Tipi</th><th>Soru Sayısı</th><th>Ağırlık Oranı</th></tr>
        <tr><td>🧠 Kavramsal Altyapı</td><td>${counts.concept}</td><td>%${Math.round(counts.concept/total*100 || 0)}</td></tr>
        <tr><td>🛠️ Uygulama / Formülasyon</td><td>${counts.apply}</td><td>%${Math.round(counts.apply/total*100 || 0)}</td></tr>
        <tr><td>🔍 Derin Analiz / Yorum</td><td>${counts.analyze}</td><td>%${Math.round(counts.analyze/total*100 || 0)}</td></tr>
        <tr><td>🔀 Karma / Hibrit Problemler</td><td>${counts.mixed}</td><td>%${Math.round(counts.mixed/total*100 || 0)}</td></tr>
    </table>`;
    
    document.getElementById('weight-info').innerHTML = html;
}

// Soruları ve Navigasyon barlarını ekrana basma
function renderQuestions(){
    const container = document.getElementById("questions");
    container.innerHTML = "";
    document.getElementById("result-box").innerHTML = "";
    
    const navBar = document.getElementById("quick-nav-bar");
    navBar.innerHTML = "";

    if(currentQuestions.length === 0){
        container.innerHTML = `<div class="empty-state">Bu sette soru bulunmamaktadır.</div>`;
        return;
    }

    currentQuestions.forEach((q, qi) => {
        const globalIdx = isReviewMode ? reviewList[qi] : ((activeSet - 1) * 20 + qi);
        const isSaved = reviewList.includes(globalIdx);

        // Hızlı Navigasyon Butonunu Oluşturma
        const dot = document.createElement("div");
        dot.className = `nav-dot ${isSaved ? 'saved' : ''}`;
        dot.id = `nav-dot-${qi}`;
        dot.textContent = qi + 1;
        dot.onclick = () => {
            document.getElementById(`q${qi}`).scrollIntoView({behavior: "smooth", block: "center"});
        };
        navBar.appendChild(dot);

        // Soru Bloğu Oluşturma
        const block = document.createElement("div");
        block.className = "qblock";
        block.id = "q" + qi;
        
        block.innerHTML = `
            <div class="qheader">
                <div class="qnum">${qi + 1}</div>
                <div class="qtext">${q.text}</div>
                <span class="qtag ${tagClass[q.tag]}">${tagLabel[q.tag]}</span>
            </div>
            <div class="opts" id="opts${qi}"></div>
            <div class="note-zone">
                <button class="notebtn ${isSaved ? 'active' : ''}" id="note-${qi}" onclick="toggleReview(${qi}, ${globalIdx})">
                    📌 ${isSaved ? 'Tekrar Listesinden Çıkar' : 'Yapamadım, Not Al'}
                </button>
            </div>
            <div class="exp" id="exp${qi}">${q.exp}</div>
        `;
        container.appendChild(block);

        // Seçenekleri Ekleme
        const optsContainer = document.getElementById("opts" + qi);
        q.opts.forEach((o, oi) => {
            const optDiv = document.createElement("div");
            optDiv.className = "opt";
            optDiv.setAttribute("data-qi", qi);
            optDiv.setAttribute("data-oi", oi);
            optDiv.innerHTML = `<div class="opt-letter">${letters[oi]}</div><span>${o}</span>`;
            optDiv.onclick = () => selectOpt(qi, oi);
            optsContainer.appendChild(optDiv);
        });
    });
}

// Kullanıcı bir seçeneğe tıkladığında
function selectOpt(qi, oi){
    if(userAnswers[qi] !== -1) return; 
    userAnswers[qi] = oi;
    
    document.querySelectorAll(`[data-qi="${qi}"]`).forEach(o => {
        const idx = parseInt(o.getAttribute("data-oi"));
        if(idx === currentQuestions[qi].ans) o.classList.add("correct");
        else if(idx === oi) o.classList.add("wrong");
    });
    
    // Çözüm açıklamasını göster
    document.getElementById("exp" + qi).style.display = "block";
    
    // Navigasyon butonunu güncelle
    const dot = document.getElementById(`nav-dot-${qi}`);
    if(dot) dot.classList.add('answered');

    // Eğer yanlış cevap verildiyse otomatik olarak hafızaya kaydet
    if(oi !== currentQuestions[qi].ans){
        const globalIdx = isReviewMode ? reviewList[qi] : ((activeSet - 1) * 20 + qi);
        if(!reviewList.includes(globalIdx)){
            addToReviewDirectly(qi, globalIdx);
        }
    }
    
    updateStats();
}

// Tekrar listesine ekleme/çıkarma (Manuel Aksiyon)
function toggleReview(qi, globalIdx){
    const btn = document.getElementById(`note-${qi}`);
    const dot = document.getElementById(`nav-dot-${qi}`);
    
    if(reviewList.includes(globalIdx)){
        reviewList = reviewList.filter(id => id !== globalIdx);
        if(btn) { btn.classList.remove('active'); btn.innerHTML = "📌 Yapamadım, Not Al"; }
        if(dot) dot.classList.remove('saved');
    } else {
        reviewList.push(globalIdx);
        if(btn) { btn.classList.add('active'); btn.innerHTML = "📌 Tekrar Listesinden Çıkar"; }
        if(dot) dot.classList.add('saved');
    }
    localStorage.setItem('tm_review_list', JSON.stringify(reviewList));
    updateReviewCountDisplay();
}

// Yanlış cevap durumunda sessizce listeye bağlama
function addToReviewDirectly(qi, globalIdx){
    reviewList.push(globalIdx);
    localStorage.setItem('tm_review_list', JSON.stringify(reviewList));
    const btn = document.getElementById(`note-${qi}`);
    const dot = document.getElementById(`nav-dot-${qi}`);
    if(btn) { btn.classList.add('active'); btn.innerHTML = "📌 Tekrar Listesinden Çıkar"; }
    if(dot) dot.classList.add('saved');
    updateReviewCountDisplay();
}

function updateReviewCountDisplay(){
    document.getElementById('review-count').textContent = reviewList.length;
}

// İstatistik verilerini dinamik güncel tutma
function updateStats(){
    const total = currentQuestions.length;
    const ans = userAnswers.filter(a => a !== -1 && a !== -2).length;
    const cor = userAnswers.filter((a, i) => a === currentQuestions[i].ans).length;
    
    document.getElementById("s-total").textContent = total;
    document.getElementById("s-answered").textContent = ans;
    document.getElementById("s-correct").textContent = cor;
    
    const scorePct = ans ? Math.round((cor / ans) * 100) : 0;
    document.getElementById("s-score").textContent = "%" + scorePct;
    
    const progressPct = total ? Math.round((userAnswers.filter(a => a !== -1).length / total) * 100) : 0;
    document.getElementById("progress").style.width = progressPct + "%";
}

// Tüm cevapları tek tıkla göster
function checkAll(){
    currentQuestions.forEach((q, qi) => {
        if(userAnswers[qi] === -1){
            userAnswers[qi] = -2; 
            document.querySelectorAll(`[data-qi="${qi}"]`).forEach(o => {
                if(parseInt(o.getAttribute("data-oi")) === q.ans) o.classList.add("correct");
            });
            document.getElementById("exp" + qi).style.display = "block";
            const dot = document.getElementById(`nav-dot-${qi}`);
            if(dot) dot.classList.add('answered');
        }
    });
    updateStats();
}

// Aktif seti sıfırlama
function resetAll(){
    userAnswers.fill(-1);
    renderQuestions();
    updateStats();
}

// Sonuç panelini getir
function showResult(){
    const cor = userAnswers.filter((a, i) => a !== -1 && a !== -2 && a === currentQuestions[i].ans).length;
    const ans = userAnswers.filter(a => a !== -1 && a !== -2).length;
    const pct = ans ? Math.round((cor / ans) * 100) : 0;
    
    let msg = pct >= 85 ? "Mükemmel! Teknik konseptleri ve algoritmaları tamamen özümsemişsiniz." : 
              pct >= 70 ? "Gayet iyi. Yanlış yaptığınız hesaplama adımlarını tekrar kontrol edin." : 
              pct >= 50 ? "Orta seviye. Tekrar listesindeki sorular üzerinden eksikleri kapatabilirsiniz." : 
              "Kavramsal altyapıya ve formüllere tekrar göz atmalısınız.";
              
    document.getElementById("result-box").innerHTML = `
        <div class="result">
            <div class="result-score">%${pct} Başarı Oranı</div>
            <div style="font-size:15px; font-weight:600; margin-bottom:6px; color:#333;">${cor} Doğru / ${ans} Cevaplanan</div>
            <div class="result-msg">${msg}</div>
        </div>
    `;
    document.getElementById("result-box").scrollIntoView({behavior: "smooth"});
}

// Sistemi çalıştır
init();
</script>
</body>
</html>
