<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:#f5f5f0;color:#1a1a18;padding:2rem 1rem}
.wrap{max-width:720px;margin:0 auto}
h1{font-size:22px;font-weight:500;margin-bottom:4px}
.subtitle{font-size:13px;color:#666;margin-bottom:1.5rem}
.stats{display:flex;gap:12px;margin-bottom:1.5rem}
.stat{flex:1;background:#fff;border:1px solid #e0e0d8;border-radius:10px;padding:12px;text-align:center}
.stat-label{font-size:12px;color:#888;margin-bottom:4px}
.stat-val{font-size:22px;font-weight:500}
.progress{background:#e0e0d8;border-radius:4px;height:6px;margin-bottom:1.5rem;overflow:hidden}
.progress-fill{height:100%;background:#3a6ea5;border-radius:4px;transition:width 0.3s}
.qblock{background:#fff;border:1px solid #e0e0d8;border-radius:12px;padding:1.25rem;margin-bottom:1rem}
.qheader{display:flex;gap:10px;align-items:flex-start;margin-bottom:12px}
.qnum{background:#f5f5f0;border-radius:8px;min-width:28px;height:28px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:500;color:#666;flex-shrink:0}
.qtag{font-size:11px;padding:2px 8px;border-radius:8px;margin-left:auto;flex-shrink:0}
.tag-concept{background:#e6f1fb;color:#185fa5}
.tag-apply{background:#eaf3de;color:#3b6d11}
.tag-analyze{background:#faeeda;color:#854f0b}
.qtext{font-size:14px;line-height:1.6}
.opts{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.opt{display:flex;align-items:center;gap:10px;padding:8px 12px;border:1px solid #e0e0d8;border-radius:8px;cursor:pointer;font-size:13px;transition:background 0.15s}
.opt:hover{background:#f5f5f0}
.opt.correct{background:#eaf3de;border-color:#639922;color:#3b6d11}
.opt.wrong{background:#fcebeb;border-color:#e24b4a;color:#a32d2d}
.opt-letter{width:22px;height:22px;border-radius:50%;background:#f5f5f0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:500;flex-shrink:0}
.exp{font-size:12px;color:#555;margin-top:10px;padding:8px 12px;background:#f5f5f0;border-radius:8px;display:none;line-height:1.6}
.actions{display:flex;gap:10px;margin-top:1.5rem;flex-wrap:wrap}
button{font-size:14px;padding:8px 20px;border:1px solid #c0c0b8;border-radius:8px;background:#fff;cursor:pointer;color:#1a1a18}
button:hover{background:#f5f5f0}
button.primary{background:#e6f1fb;border-color:#b5d4f4;color:#185fa5}
.result{background:#f5f5f0;border-radius:12px;padding:2rem;text-align:center;margin-top:1rem}
.result-score{font-size:48px;font-weight:500;margin-bottom:8px}
.result-msg{font-size:14px;color:#555}
</style>

<body>
<div class="wrap">
<h1>Metin madenciliği — Final sınavı (3. set)</h1>
<p class="subtitle">20 soru · Çoktan seçmeli · Her soru 5 puan</p>
<div class="stats">
<div class="stat"><div class="stat-label">Toplam soru</div><div class="stat-val">20</div></div>
<div class="stat"><div class="stat-label">Cevaplanan</div><div class="stat-val" id="s-answered">0</div></div>
<div class="stat"><div class="stat-label">Doğru</div><div class="stat-val" id="s-correct">0</div></div>
<div class="stat"><div class="stat-label">Puan</div><div class="stat-val" id="s-score">0</div></div>

<script>
const questions=[
{text:"Metin madenciliğinde özet çıkarmanın temel amacı nedir?",tag:"concept",opts:["Metni farklı bir dile çevirmek","Metnin ana fikrini koruyarak daha kısa biçimde sunmak","Metindeki tüm cümleleri alfabetik sıralamak","Metni görsel bir formata dönüştürmek"],ans:1,exp:"Özet çıkarma, uzun bir metnin temel anlamını koruyarak daha kısa ve anlaşılır bir biçimde sunma işlemidir."},
{text:"Çıkarımsal (extractive) özetleme yöntemi nasıl çalışır?",tag:"concept",opts:["Metinden tamamen yeni cümleler üretir","Metni farklı bir dile çevirir","Metindeki önemli cümleleri aynen seçer","Yalnızca ilk ve son paragrafı alır"],ans:2,exp:"Çıkarımsal özetlemede sistem yeni cümle üretmez; var olan metinden en anlamlı cümleleri seçer."},
{text:"Soyutlayıcı (abstractive) özetlemede en büyük dezavantaj nedir?",tag:"analyze",opts:["Çok yavaş çalışır","Yanlış bilgi (halüsinasyon) üretme riski vardır","Yalnızca kısa metinlerde çalışır","Ön işleme gerektirmez"],ans:1,exp:"Soyutlayıcı özetlemede büyük dil modelleri bazen metinde olmayan bilgileri ekleyebilir; buna halüsinasyon denir."},
{text:"TF-IDF yönteminde hangi kelimelere daha yüksek ağırlık verilir?",tag:"concept",opts:["Metinde çok sık geçen kelimeler","Her metinde ortak olan stop-word'ler","Metinde önemli ama her yerde geçmeyen kelimeler","Yalnızca isimler ve sıfatlar"],ans:2,exp:"TF-IDF'de metinde önemli olan ama her yerde geçmeyen kelimelere daha yüksek ağırlık verilir."},
{text:"Otomatik özetleme sürecinde cümle önem skorunu etkileyen faktör hangisi DEĞİLDİR?",tag:"apply",opts:["Cümlenin metindeki konumu","Metnin yazarının yaşı","Başlıkla benzerliği","Diğer cümlelerle benzerliği"],ans:1,exp:"Cümle önem skoru; konum, başlık benzerliği, anahtar kelime sayısı, diğer cümlelerle benzerlik gibi faktörlere göre hesaplanır. Yazarın yaşı bu faktörler arasında yer almaz."},
{text:"Duygu analizi için kullanılan İngilizce terim hangisidir?",tag:"concept",opts:["Text Classification","Named Entity Recognition","Sentiment Analysis","Topic Modeling"],ans:2,exp:"Duygu analizi İngilizcede Sentiment Analysis veya Opinion Mining olarak adlandırılır."},
{text:"'Ürün güzel değil.' cümlesi LSTM modeli açısından neden önemli bir örnektir?",tag:"analyze",opts:["Cümle çok kısadır","'-mA' olumsuzluk ekinin anlamı değiştirdiğini ve LSTM'in kelime sırasını dikkate alması gerektiğini gösterir","Cümlede emoji kullanılmıştır","Cümle birden fazla öznellik içerir"],ans:1,exp:"'güzel' kelimesi tek başına olumlu görünür; ancak 'değil' kelimesi anlamı olumsuza çevirir. LSTM bu tür ilişkileri kelime sırasını dikkate alarak daha iyi öğrenebilir."},
{text:"Görünüş/özellik tabanlı duygu analizinin (Aspect-Based Sentiment Analysis) amacı nedir?",tag:"concept",opts:["Metnin genel olumlu/olumsuz olduğunu bulmak","Belirli özellikler hakkındaki duyguyu ayrı ayrı belirlemek","Yalnızca sosyal medya verilerini analiz etmek","Duygunun şiddetini ölçmek"],ans:1,exp:"Bu yöntemde metnin tamamı yerine belirli özellikler (kamera, batarya, konum vb.) hakkındaki duygu ayrı ayrı belirlenir."},
{text:"Türkçe duygu analizini zorlaştıran temel özellik nedir?",tag:"analyze",opts:["Türkçe harflerinin Unicode gerektirmesi","Türkçenin eklemeli bir dil yapısına sahip olması","Türkçede emoji kullanılmaması","Türkçede ironi bulunmaması"],ans:1,exp:"Türkçe eklemeli bir dil olduğu için bir kelime çok sayıda ek alabilir; bu durum kelime temsili ve kök bulma işlemlerini zorlaştırır."},
{text:"Sözlük tabanlı duygu analizinin en önemli dezavantajı nedir?",tag:"analyze",opts:["Çok fazla veri gerektirir","İroni ve olumsuzlama gibi bağlamsal durumları anlamakta zorlanır","Yalnızca İngilizce için çalışır","Transformer modellerinden daha yavaştır"],ans:1,exp:"Sözlük tabanlı yöntemler bağlamı anlamakta zorlanır; ironi, mecaz, olumsuzluk ve çok anlamlı kelimelerde başarısı düşebilir."},
{text:"Spam tespiti hangi tür bir makine öğrenmesi problemidir?",tag:"concept",opts:["Kümeleme (Clustering)","Boyut indirgeme","Metin sınıflandırma","Regresyon"],ans:2,exp:"Spam tespiti, metni önceden belirlenmiş sınıflardan (spam / normal) birine atama işlemi olduğu için metin sınıflandırma problemidir."},
{text:"'Bu linke sakın tıklamayın, dolandırıcılık olabilir.' cümlesi için hangi yargı doğrudur?",tag:"apply",opts:["Bu cümle kesinlikle spamdir","Basit kelime tabanlı yöntemler bu cümleyi yanlışlıkla spam olarak sınıflandırabilir","BERT modeli bu cümleyi mutlaka spam olarak işaretler","Bu cümle tamamen nötr bir içerik taşır"],ans:1,exp:"'link' ve 'dolandırıcılık' gibi spam ile ilişkili kelimeler içerse de bu mesaj uyarı amaçlıdır. Basit yöntemler bağlamı kaçırarak yanlış sınıflandırabilir; transformer tabanlı modeller bağlamı daha iyi değerlendirebilir."},
{text:"Spam tespitinde N-gram özelliklerinin tek kelimelere göre avantajı nedir?",tag:"analyze",opts:["N-gramlar daha az bellek kullanır","'Ödül kazandınız' gibi çok kelimeli kalıpları yakalayabilir","N-gramlar ön işleme gerektirmez","N-gramlar her zaman daha yüksek doğruluk sağlar"],ans:1,exp:"'Ödül kazandınız', 'hemen tıklayın', 'hesabınız askıya alındı' gibi ifadeler kelime grupları olarak daha anlamlı ipuçları sunar; tek kelimeler bu kalıpları yeterince yakalayamaz."},
{text:"Metin sınıflandırmada çok etiketli (multi-label) sınıflandırma ne zaman kullanılır?",tag:"concept",opts:["Metin yalnızca iki sınıftan birine aitse","Bir metin aynı anda birden fazla kategoriye ait olabiliyorsa","Sınıf sayısı ikiden fazlaysa","Verinin büyük bölümü etiketlenmemişse"],ans:1,exp:"Çok etiketli sınıflandırmada bir metin aynı anda birden fazla kategoriye ait olabilir. Örneğin 'Yapay zekâ destekli sağlık uygulaması' hem teknoloji hem sağlık kategorisine girebilir."},
{text:"Transformer modellerinin duygu analizindeki temel üstünlüğü nedir?",tag:"analyze",opts:["Daha az parametreye sahip olmaları","Attention mekanizmasıyla kelimelerin bağlamını daha iyi yakalayabilmeleri","Etiketli veri gerektirmemeleri","Yalnızca kısa metinlerde etkili olmaları"],ans:1,exp:"Transformer modelleri attention mekanizması ile cümledeki kelimelerin birbirleriyle ilişkisini öğrenir ve kelimenin anlamını bulunduğu bağlama göre değerlendirebilir."},
{text:"İntihal tespitinde Jaccard benzerliği neyi hesaplar?",tag:"concept",opts:["İki vektör arasındaki açıyı","İki metindeki ortak kelimelerin tüm farklı kelimelere oranını","Metnin TF-IDF ağırlıklarını","Cümlelerin anlamsal yakınlığını"],ans:1,exp:"Jaccard benzerliği = ortak kelimeler / tüm farklı kelimeler formülüyle hesaplanır ve iki metindeki sözcük örtüşme oranını ölçer."},
{text:"'Yapay zekâ sağlıkta hastalık tahmini için kullanılmaktadır.' ile 'AI sistemleri rahatsızlıkların erken dönemde belirlenmesine yardımcı olur.' cümleleri için hangi yöntem daha başarılı olur?",tag:"apply",opts:["Tam eşleşme yöntemi","N-gram tabanlı yöntem","Anlamsal benzerlik yöntemleri (BERT, Sentence-BERT)","Parmak izi yöntemi"],ans:2,exp:"Bu iki cümle kelime olarak farklı ama anlam olarak benzerdir. Anlamsal benzerlik yöntemleri kelimeleri vektörle temsil ettiğinden farklı kelimelerle yazılmış benzer anlamları yakalayabilir."},
{text:"Metin sınıflandırmada veri dengesizliği hangi soruna yol açar?",tag:"analyze",opts:["Model daha hızlı eğitilir","Model az örneğe sahip kategorileri öğrenmekte zorlanır","Ön işleme adımları atlanabilir","Stop-word temizleme daha önemli hale gelir"],ans:1,exp:"Bazı kategorilerde çok az veri varsa model bu kategorileri öğrenmekte zorlanır ve tahminlerini çoğunlukla büyük veri setine sahip kategorilere yönlendirir."},
{text:"Phishing (kimlik avı) mesajlarının diğer spam mesajlardan farkı nedir?",tag:"concept",opts:["Phishing mesajları yalnızca SMS ile gönderilir","Phishing mesajları şifre veya kredi kartı gibi kişisel bilgi almaya çalışır","Phishing mesajlarında asla link bulunmaz","Phishing mesajları yalnızca reklam içerir"],ans:1,exp:"Phishing mesajları yalnızca reklam değil, dolandırıcılık amaçlıdır; kullanıcıdan şifre, kredi kartı bilgisi veya kişisel bilgi almaya çalışır."},
{text:"İntihal tespitinde yüksek benzerlik oranı her zaman intihal anlamına gelir mi?",tag:"analyze",opts:["Evet, %30 üzeri her benzerlik intihale işaret eder","Hayır; kaynakça, teknik terimler veya standart ifadeler oranı artırabilir","Evet, yalnızca parafraz yapılmışsa sorun olmaz","Hayır, çünkü hiçbir metin başka bir metne benzemez"],ans:1,exp:"Benzerlik oranı tek başına intihal anlamına gelmez. Kaynakça, yöntem isimleri, teknik terimler, kanun maddeleri benzerlik oranını artırabilir. Sonuçlar insan değerlendirmesiyle birlikte yorumlanmalıdır."},




{text:"Otomatik özetleme sürecinde 'cümle seçimi' aşamasında yalnızca en yüksek skorlu cümleleri almak neden yeterli değildir?",tag:"analyze",opts:["Çünkü yüksek skorlu cümleler her zaman kısadır","Çünkü bazı cümleler birbirinin tekrarı olabilir ve özet gereksiz yere uzayabilir","Çünkü düşük skorlu cümleler daha önemlidir","Çünkü tüm cümleler eşit skora sahiptir"],ans:1,exp:"Yüksek skorlu cümleler seçilirken tekrar eden bilgiyi azaltmak, özeti akıcı tutmak ve metnin genel konusunu korumak da gereklidir. Sadece skora bakmak özeti tekrarlı hale getirebilir."},
{text:"Aşağıdaki cümle temsil yöntemlerinden hangisi kelimelerin anlamsal ilişkilerini en iyi yakalar?",tag:"concept",opts:["Bag of Words","TF-IDF","BERT embedding","Kelime frekansı sayımı"],ans:2,exp:"BERT embedding, transformer tabanlı bir yöntem olarak kelimelerin bağlama göre anlamını vektörlerle temsil eder. Bag of Words ve TF-IDF ise kelimelerin anlamsal ilişkilerini değil yalnızca sayısal ağırlıklarını gösterir."},
{text:"Extractive özetlemede özet bazen akıcı olmayabilir. Bunun temel nedeni nedir?",tag:"analyze",opts:["Model çok az parametre kullanır","Cümleler doğrudan metinden seçildiği için aralarında bağlantı kuracak yeni ifadeler eklenmez","Yöntem yalnızca kısa metinler için tasarlanmıştır","Cümleler rastgele seçilir"],ans:1,exp:"Extractive özetlemede cümleler doğrudan metinden seçilir ve yeni bir düzenleme yapılmaz. Bu nedenle seçilen cümleler arasında anlatım akışı kopuk olabilir."},
{text:"Duygu analizinde 'öznellik analizi' ne amaçla kullanılır?",tag:"concept",opts:["Metnin hangi dilde yazıldığını belirlemek","Bir cümlenin kişisel görüş mü yoksa nesnel bilgi mi içerdiğini belirlemek","Duygunun şiddetini ölçmek","Metindeki ironiyi tespit etmek"],ans:1,exp:"Öznellik analizi bir cümlenin öznel (kişisel görüş) mi yoksa nesnel (bilgi) mi olduğunu belirler. Duygu analizi genellikle öznel ifadeler üzerinde daha anlamlıdır."},
{text:"'Harika, yine kargo gecikti!' cümlesinde sözlük tabanlı duygu analizi neden başarısız olabilir?",tag:"apply",opts:["'Harika' kelimesi sözlükte yoktur","'Kargo' kelimesi olumsuz olarak etiketlenmiştir","'Harika' kelimesi olumlu görünse de cümle bağlamı itibarıyla olumsuzdur (ironi)","Cümle çok uzundur"],ans:2,exp:"Sözlük tabanlı yöntemler bağlamı ve ironiyi anlayamaz. 'Harika' kelimesine olumlu puan verirken cümlenin gerçek anlamının olumsuz olduğunu kaçırır."},
{text:"Çok sınıflı duygu analizinde (çok olumlu / olumlu / nötr / olumsuz / çok olumsuz) hangi uygulama alanı en uygun örnektir?",tag:"apply",opts:["E-posta spam filtresi","Yıldız puanlama sistemindeki ürün yorumları","Haber kategorilendirme","Akademik makale sınıflandırma"],ans:1,exp:"Yıldız puanlama sistemleri (1-5 yıldız) doğal olarak çok sınıflı bir yapıya sahiptir ve çok sınıflı duygu analizine en uygun uygulama alanıdır."},
{text:"Spam tespitinde 'yapısal özellikler' hangi bilgileri kapsar?",tag:"concept",opts:["Kelimelerin köklerini","Mesaj uzunluğu, ünlem sayısı, büyük harf oranı, link sayısı gibi biçimsel özellikleri","Gönderenin kimliğini","N-gram frekanslarını"],ans:1,exp:"Yapısal özellikler; mesaj uzunluğu, ünlem işareti sayısı, büyük harf oranı, link sayısı, telefon numarası varlığı, para birimi gibi metnin biçimsel özelliklerini kapsar."},
{text:"Naive Bayes algoritması spam tespitinde neden yaygın olarak tercih edilir?",tag:"analyze",opts:["Kelime olasılıklarına dayalı olarak bir mesajın spam olma ihtimalini hesaplar ve basit ama etkilidir","Her zaman en yüksek doğruluğu verir","Ön işleme gerektirmez","Transformer modellerinden daha güçlüdür"],ans:0,exp:"Naive Bayes, kelime olasılıklarına dayalı olarak bir mesajın spam olma ihtimalini hesaplar. Basit, hızlı ve spam tespitinde klasik olarak kullanılan etkili bir yöntemdir."},
{text:"Metin sınıflandırmada hiyerarşik sınıflandırma ne anlama gelir?",tag:"concept",opts:["Metinlerin yalnızca iki sınıfa ayrılması","Kategorilerin ana ve alt kategoriler şeklinde kademeli olarak düzenlenmesi","Her metnin birden fazla etikete sahip olması","Sınıfların eşit veri dağılımına sahip olması"],ans:1,exp:"Hiyerarşik sınıflandırmada kategoriler ana ve alt kategoriler şeklinde düzenlenir. Örneğin bir metin önce 'Spor' sonra 'Futbol' alt kategorisine atanabilir."},
{text:"'Virüs bilgisayara bulaştı.' ve 'Virüs hastalığa neden oldu.' cümleleri metin sınıflandırma açısından hangi problemi örnekler?",tag:"apply",opts:["Veri dengesizliği problemi","Çok anlamlı kelime (bağlam) problemi","Yanlış etiketleme problemi","Kısa metin problemi"],ans:1,exp:"'Virüs' kelimesi bağlama göre teknoloji veya sağlık kategorisini işaret edebilir. Bu, metin sınıflandırmada çok anlamlı kelime ve bağlam problemini örnekler."},
{text:"İntihal tespitinde 'parmak izi yöntemi' nasıl çalışır?",tag:"concept",opts:["Metnin tamamını tek seferde karşılaştırır","Metinden seçilen kısa ve ayırt edici parçalarla belge için temsil oluşturur ve bunları karşılaştırır","Yalnızca başlık ve özeti analiz eder","Metnin yazarının kimliğini belirler"],ans:1,exp:"Parmak izi yönteminde metinden kısa ve ayırt edici parçalar seçilir. Bu parçalar belgeyi temsil eden bir imza oluşturur ve büyük koleksiyonlarda hızlı karşılaştırma yapmayı sağlar."},
{text:"Kosinüs benzerliği değeri 1'e yaklaştıkça ne anlama gelir?",tag:"concept",opts:["Metinler hiç benzer değildir","İki metin vektörü arasındaki açı büyüdükçe metinler benzerleşir","İki metin birbirine çok benzer ya da neredeyse aynıdır","Metinlerin dili farklıdır"],ans:2,exp:"Kosinüs benzerliği 0 ile 1 arasında değer alır. 1'e yaklaştıkça iki metin vektörü arasındaki açı küçülür ve metinler birbirine çok benzer demektir."},
{text:"Parafraz intihali neden klasik kelime eşleşme yöntemleriyle zor yakalanır?",tag:"analyze",opts:["Parafraz edilmiş metinler her zaman daha kısadır","Kelimeler farklı olduğu için kelime eşleşmesi düşük çıkar, ancak anlam benzerdir","Parafraz edilen metinler kaynak gösterir","Kelime eşleşme yöntemleri çok hızlı çalışır"],ans:1,exp:"Parafraz intihali, kaynak metnin farklı kelimelerle yeniden yazılmasıdır. Kelimeler farklı olduğu için kelime tabanlı benzerlik düşük çıkabilir; ancak anlam korunmuştur. Bu yüzden anlamsal benzerlik yöntemleri gerekir."},
{text:"Türkçe duygu analizinde '-me / -ma' olumsuzluk eklerinin önemi nedir?",tag:"analyze",opts:["Bu ekler Türkçede çok nadiren kullanılır","Bu ekler kelimenin anlamını olumludan olumsuza çevirdiği için modelin bu yapıyı doğru öğrenmesi gerekir","Bu ekler yalnızca fiillerde görülür ve duygu analizi için önemsizdir","Bu ekler stop-word listesine dahil edilir"],ans:1,exp:"Türkçede olumsuzluk çoğu zaman '-me/-ma' ekleriyle verilir. 'Beğendim' olumlu iken 'Beğenmedim' olumsuzdur. Modelin bu ekleri doğru yorumlaması kritiktir."},
{text:"Metin sınıflandırmada 'alan bağımlılığı' problemi ne anlama gelir?",tag:"analyze",opts:["Modelin yalnızca büyük veri setlerinde çalışması","Bir alanda eğitilen modelin farklı bir alanda başarısız olabilmesi","Modelin yalnızca belirli dilleri desteklemesi","Sınıfların birbirine çok benzer olması"],ans:1,exp:"Bir alanda (örn. haber metinleri) eğitilen model, farklı alan dilini kullanan verilerde (örn. sosyal medya) başarısız olabilir. Dil kullanımı, kelime seçimi ve cümle yapısı farklılıkları modeli yanıltabilir."},
{text:"İntihal tespitinde çeviri yoluyla intihal neden özellikle zordur?",tag:"analyze",opts:["Çeviri araçları her zaman hata yapar","Farklı dillerdeki metinlerde kelime eşleşmesi yoktur; anlamsal yöntemler gerekir","Çeviri yapan kişi kaynağı her zaman gösterir","Çeviri metinleri daha uzun olur"],ans:1,exp:"Bir İngilizce paragrafın Türkçeye çevrilmesinde kelime benzerliği neredeyse yoktur. Bu tür intihali yakalamak için diller arası anlamsal benzerlik yöntemleri gerekir."},
{text:"Spam tespitinde transformer tabanlı modellerin kural tabanlı yöntemlere üstünlüğü nedir?",tag:"analyze",opts:["Kural tabanlı yöntemler daha fazla bellek gerektirir","Transformer modelleri kelimelerin bağlamını anlayarak yanlış pozitifleri azaltabilir","Kural tabanlı yöntemler etiketli veri gerektirir","Transformer modelleri her zaman daha hızlıdır"],ans:1,exp:"Kural tabanlı yöntemler bağlamı anlamaz ve masum mesajları yanlışlıkla spam olarak işaretleyebilir. Transformer modelleri bağlamı değerlendirerek bu tür hataları azaltabilir."},
{text:"Duygu analizinde 'tutum analizi' diğer duygu analizi türlerinden nasıl ayrılır?",tag:"concept",opts:["Tutum analizi yalnızca sosyal medyada uygulanır","Tutum analizi olumlu/olumsuz ayrımı yerine bir konuya destekleyici/karşı/tarafsız duruşu belirler","Tutum analizi yalnızca sayısal verilerle çalışır","Tutum analizi duygu şiddetini ölçer"],ans:1,exp:"Tutum analizinde amaç doğrudan olumlu/olumsuz duygu değil, kişinin bir konuya (yasa, kampanya, marka) karşı destekleyici mi, karşı mı yoksa tarafsız mı olduğunu belirlemektir."},
{text:"Metin ön işleme aşamasında 'lemmatization' ile 'kök bulma (stemming)' arasındaki temel fark nedir?",tag:"concept",opts:["Lemmatization daha hızlıdır","Kök bulma kelimenin dilbilgisel köküne (lemma) ulaşırken stemming ham bir kesme işlemi yapar","Lemmatization yalnızca İngilizce için çalışır","İkisi aynı işlemi farklı adlarla yapar"],ans:1,exp:"Stemming ham bir kırpma işlemidir ve her zaman geçerli bir kelime üretmeyebilir. Lemmatization ise kelimenin dilbilgisel sözlük formuna (lemma) ulaşır ve daha doğru sonuçlar verir."},
{text:"İntihal tespitinde benzerlik oranı eşik değerinin belirlenmesinde hangi faktör göz önünde bulundurulmalıdır?",tag:"analyze",opts:["Metnin yazıldığı yıl","Metnin türü; teknik terimler ve kaynakça yoğun metinlerde eşik daha yüksek tutulabilir","Yazarın milliyeti","Metnin uzunluğu her zaman belirleyicidir"],ans:1,exp:"Eşik değeri metnin türüne göre değişmelidir. Tıp, hukuk veya mühendislik metinlerinde kaçınılmaz teknik ifadeler benzerlik oranını artırabilir. Bu nedenle her metin türü için eşik değeri ayrı değerlendirilmelidir."},

{text:"Klasik sayısallaştırma yöntemleri olan Bag of Words ve TF-IDF'nin ortak eksikliği nedir?",tag:"concept",opts:["Hesaplama maliyetleri çok yüksektir","Kelime frekansı kullanırlar fakat kelimelerin anlamsal bilgisini taşımazlar","Yalnızca İngilizce metinlerde çalışırlar","Büyük veri setlerini desteklemezler"],ans:1,exp:"Bag of Words ve TF-IDF kelime frekansına dayalı klasik yöntemlerdir. Her ikisi de kelimelerin anlam bilgisini (semantik ilişkilerini) taşımaz; yalnızca sayısal ağırlıklar üretir."},
{text:"Word2Vec, GloVe ve FastText gibi Word Embedding yöntemlerinin temel çalışma mantığı nedir?",tag:"concept",opts:["Her cümle için tek bir vektör üretirler","Her kelime için anlam taşıyan bir vektör öğrenirler ve bağlamdan anlam çıkarırlar","Kelimeleri karakter karakter analiz ederler","Yalnızca sık kullanılan kelimeleri temsil ederler"],ans:1,exp:"Word Embedding yöntemlerinde her kelime için bir vektör öğrenilir. Model, kelimenin çevresindeki kelimeleri referans alarak anlam öğrenir. Böylece anlamca yakın kelimeler vektör uzayında birbirine yakın konumlanır."},
{text:"Word2Vec'in 'bank' kelimesi için ürettiği vektörde ne tür bir sorun oluşur?",tag:"analyze",opts:["'Bank' kelimesi için hiç vektör üretilemez","'Bank' kelimesi finans veya nehir kıyısı anlamında kullanılsa da her bağlamda aynı vektör atanır","'Bank' kelimesi vektör uzayında sıfır noktasına yerleşir","'Bank' kelimesinin vektörü her cümlede sıfırlanır"],ans:1,exp:"Word2Vec'te her kelime için TEK bir vektör öğrenilir. 'Bank' kelimesi 'finans kurumu' veya 'nehir kıyısı' anlamında kullanılsa da aynı vektörü alır. Bu durum çok anlamlı kelimelerde anlam karışıklığına yol açar."},
{text:"Transformer mimarisi, RNN ve LSTM gibi eski modellere göre ne açıdan üstündür?",tag:"analyze",opts:["Daha az parametre kullanır","Attention mekanizmasıyla tüm cümleyi bütün olarak analiz eder ve bağlamı daha iyi öğrenir","Yalnızca kısa cümleler için tasarlanmıştır","Sıralı işlem yapmak zorunda olmadığından her zaman daha hızlıdır"],ans:1,exp:"RNN ve LSTM sıralı modeller olup tüm cümleyi bütünüyle analiz etmekte yetersiz kalabilir. Transformer, attention mekanizmasıyla cümledeki tüm kelimelerin birbirleriyle ilişkisini aynı anda değerlendirir."},
{text:"'Ali kitabı Ahmet'e verdi çünkü o çalışkandı.' cümlesinde 'o' zamirinin kimi temsil ettiğini attention mekanizması nasıl belirler?",tag:"apply",opts:["'O' kelimesinin hemen öncesindeki kelimeye bakarak","Cümledeki tüm kelimeler arasındaki ilişkiyi değerlendirerek hangi kelimeyle daha güçlü bağ kurduğunu hesaplayarak","'O' kelimesinin alfabetik sırasına göre","Yalnızca 'verdi' ve 'çalışkandı' kelimelerine bakarak"],ans:1,exp:"Attention mekanizması 'o' kelimesini anlamlandırmak için cümledeki diğer tüm kelimelere (Ali, Ahmet, verdi, çalışkandı) dikkat skorları hesaplar. Hangi kelimeyle daha güçlü ilişki kurulursa 'o' o kişiyi temsil ediyor kabul edilir."},
{text:"Attention mekanizmasında Query (Q), Key (K) ve Value (V) kavramları neyi temsil eder?",tag:"concept",opts:["Q: kelimenin frekansı, K: kelimenin uzunluğu, V: kelimenin kökü","Q: 'Ben kimi arıyorum?', K: 'Ben kimim?', V: 'Benim taşıdığım bilgi ne?'","Q: sorgu cümlesi, K: anahtar kelime, V: kelime vektörü","Q: giriş katmanı, K: gizli katman, V: çıkış katmanı"],ans:1,exp:"Transformer'da her kelime için Q (neyi aradığım), K (ben kimim) ve V (taşıdığım bilgi) olmak üzere üç temsil oluşturulur. Bir kelimenin diğer kelimelere ne kadar dikkat edeceği Q ve K'nın dot product'ı ile hesaplanır."},
{text:"'I deposited money in the bank' cümlesinde transformer'ın 'bank' kelimesini 'finans kurumu' olarak yorumlamasını sağlayan şey nedir?",tag:"apply",opts:["'Bank' kelimesinin cümlenin sonunda olması","'Bank' ile 'money' arasındaki attention skorunun 'bank' ile 'river' arasındaki skordan yüksek çıkması","'Deposited' kelimesinin sözlükte finans terimleriyle ilişkilendirilmesi","'I' zamirinin attention mekanizmasında ağırlıklı rol oynaması"],ans:1,exp:"Transformer dot product hesabında bank→money skoru (0.32) bank→river skorundan (0.19) yüksek çıkar. Bu yüzden model 'bank' kelimesini 'money' bağlamında değerlendirerek finans kurumu anlamına yönelir."},
{text:"BERT modelinin temel özelliği nedir ve hangi firmatarafından geliştirilmiştir?",tag:"concept",opts:["Sadece önceki tokenlara bakan, OpenAI tarafından geliştirilen bir decoder modelidir","Çift yönlü attention kullanan, cümlenin hem sağını hem solunu gören ve Google tarafından geliştirilen bir encoder modelidir","Metin üretmeye odaklanan, Meta tarafından geliştirilen bir encoder-decoder modelidir","Yalnızca özetleme görevi için tasarlanmış, Google tarafından geliştirilen bir modeldir"],ans:1,exp:"BERT (Bidirectional Encoder Representations from Transformers), Google tarafından geliştirilmiş bir encoder modelidir. Çift yönlü attention kullanır; yani bir kelimeyi anlamlandırmak için cümlenin hem sağına hem soluna bakabilir. Sınıflandırma ve duygu analizi gibi görevlerde çok başarılıdır."},
{text:"GPT modelini BERT'ten ayıran temel fark nedir?",tag:"analyze",opts:["GPT çift yönlü, BERT tek yönlü attention kullanır","GPT yalnızca önceki tokenlara bakarak bir sonraki kelimeyi tahmin eder (autoregressive); BERT ise cümlenin tamamını çift yönlü analiz eder","GPT encoder, BERT decoder mimarisidir","GPT özetleme için, BERT metin üretmek için kullanılır"],ans:1,exp:"GPT bir decoder modelidir; yalnızca önceki tokenlara bakarak bir sonraki tokenı tahmin eder (autoregressive). BERT ise encoder modelidir; cümlenin hem sağını hem solunu görerek bağlamsal temsil üretir. GPT metin üretiminde, BERT anlama görevlerinde öne çıkar."},
{text:"T5 modelinin 'her şeyi text-to-text problemi yapma' mantığı ne anlama gelir?",tag:"concept",opts:["T5 yalnızca metin çevirisi yapar","Her görevi (özetleme, sınıflandırma, çeviri) girdi ve çıktısı metin olan tek tip bir yapıya dönüştürür","T5 yalnızca İngilizce metinlerle çalışır","T5 metin yerine sayısal vektörlerle çalışır"],ans:1,exp:"T5 (Text-to-Text Transfer Transformer) her görevi 'metin girişi → metin çıkışı' formatına çevirir. Örneğin sınıflandırmada da çıktı bir etiket metni olarak üretilir. Bu yaklaşım tek bir model mimarisini birden fazla görev için kullanmayı sağlar."},
{text:"Pegasus ve BART modelleri hangi görev için özellikle güçlüdür ve hangi firmalar tarafından geliştirilmiştir?",tag:"concept",opts:["Pegasus: çeviri (Google), BART: soru-cevap (OpenAI)","Pegasus: özetleme (Google), BART: özetleme ve metin üretimi (Meta/Facebook)","Pegasus: duygu analizi (Google), BART: spam tespiti (Meta/Facebook)","Pegasus: metin sınıflandırma (OpenAI), BART: özetleme (Google)"],ans:1,exp:"Pegasus Google tarafından geliştirilmiş ve özellikle özetleme (summarization) için tasarlanmış güçlü bir encoder-decoder modelidir. BART ise Meta (Facebook) tarafından geliştirilmiş olup özetleme, metin üretimi ve çeviri görevlerinde kullanılır."},
{text:"Encoder modelleri ile decoder modelleri arasındaki temel amaç farkı nedir?",tag:"concept",opts:["Encoder daha büyük, decoder daha küçük modellerdir","Encoder metni anlamlı temsillere dönüştürmek için kullanılırken, decoder metin üretmek için kullanılır","Encoder yalnızca Türkçe, decoder yalnızca İngilizce metinlerde çalışır","Encoder daha eski, decoder daha yeni bir mimaridir"],ans:1,exp:"Encoder modelleri (BERT gibi) metni anlamak, sınıflandırmak ve embedding üretmek için tasarlanmıştır. Decoder modelleri (GPT gibi) ise önceki tokenlara bakarak yeni metin üretmek için kullanılır. Encoder-decoder modelleri (T5, BART) her ikisini birden yapar."},
{text:"Word Embedding yöntemlerinde 'kral - erkek + kadın ≈ kraliçe' ilişkisi neyi gösterir?",tag:"analyze",opts:["Kelimelerin harflerinin sayısal toplamları birbirine eşittir","Kelime vektörleri arasındaki matematiksel işlemlerle anlamsal ilişkiler modellenebilir","Bu yöntem yalnızca İngilizce için geçerlidir","Modelin ezber yaptığını gösterir"],ans:1,exp:"Word Embedding yöntemlerinde anlamca ilişkili kelimeler vektör uzayında birbirine yakın konumlanır. 'Kral - erkek + kadın ≈ kraliçe' ilişkisi, kelimelerin anlamsal özelliklerinin vektör aritmetiğiyle modellendiğini gösterir."},
{text:"Metin madenciliğinde embedding tabanlı yöntemlerin klasik yöntemlere (BoW, TF-IDF) en önemli avantajı nedir?",tag:"analyze",opts:["Her zaman daha hızlı hesaplanırlar","Kelimelerin anlamsal ilişkilerini ve bağlamını sayısal vektörlere yansıtabilirler","Daha az bellek kullanırlar","Etiketli veri gerektirmezler"],ans:1,exp:"Klasik yöntemler yalnızca kelime frekanslarını sayısal olarak temsil eder; anlam bilgisi taşımaz. Embedding tabanlı yöntemler ise kelimelerin anlamsal ilişkilerini (örn. 'araba' ve 'otomobil' benzer bağlamlarda) ve bağlamı vektörlere yansıtabilir."},
{text:"BERT hangi tür görevlerde öne çıkar?",tag:"concept",opts:["Metin üretme, hikaye yazma ve chatbot geliştirme","Duygu analizi, metin sınıflandırma ve bağlamsal embedding üretme","Yalnızca makine çevirisi","Yalnızca özetleme görevi"],ans:1,exp:"BERT encoder mimarisiyle metni derinlemesine anlamlandırır. Bu nedenle duygu analizi, metin sınıflandırma, adlandırılmış varlık tanıma ve bağlamsal embedding üretme gibi 'metni anlama' görevlerinde çok başarılıdır."},
{text:"'I sat near the river bank' cümlesinde transformer 'bank' kelimesine 'nehir kıyısı' anlamını nasıl verir?",tag:"apply",opts:["'Bank' kelimesi cümlede sona yakın olduğu için","'Bank' ile 'river' arasındaki attention skoru 'bank' ile 'money' arasındaki skordan yüksek çıktığı için","'Sat' fiilinin finans bağlamında kullanılmaması nedeniyle","'Near' kelimesinin konum belirten bir edat olması nedeniyle"],ans:1,exp:"Dot product hesabında bank→river skoru (0.44), bank→money skorundan (0.18) çok daha yüksek çıkar. Model bu farka göre 'bank' kelimesine 'river' bağlamında, yani nehir kıyısı anlamında bir embedding atar."},
{text:"Transformer embedding ile Word2Vec arasındaki en temel fark nedir?",tag:"analyze",opts:["Word2Vec daha büyük modeller üretir","Transformer aynı kelime için farklı bağlamlarda farklı vektörler üretirken Word2Vec her kelimeye tek ve sabit bir vektör atar","Word2Vec daha yeni bir teknolojidir","Transformer yalnızca İngilizce metinlerde çalışır"],ans:1,exp:"Word2Vec'te her kelime için TEK ve sabit bir vektör öğrenilir. BERT gibi transformer tabanlı modeller ise aynı kelime için bulunduğu bağlama göre farklı vektörler üretir. Bu sayede çok anlamlı kelimeler doğru yorumlanabilir."},
{text:"Encoder-decoder mimarisinin encoder-only ve decoder-only mimarilerden farkı nedir?",tag:"concept",opts:["Encoder-decoder yalnızca görüntü işleme için kullanılır","Encoder-decoder hem girdi metnini anlar hem de yeni metin üretir; bu nedenle özetleme ve çeviri gibi dönüşüm görevlerine uygundur","Encoder-decoder daha az parametre kullanır","Encoder-decoder yalnızca kısa metinler için tasarlanmıştır"],ans:1,exp:"Encoder-only (BERT) metni anlamak için, decoder-only (GPT) metin üretmek için kullanılır. Encoder-decoder mimarisi (T5, BART, Pegasus) ise önce girdiyi anlar sonra çıktı üretir. Bu yüzden çeviri, özetleme gibi 'girdi→çıktı' dönüşümü gerektiren görevler için idealdir."},
{text:"FastText'in Word2Vec'ten farkı nedir?",tag:"concept",opts:["FastText yalnızca cümle düzeyinde vektör üretir","FastText kelimeleri karakter n-gramlarına ayırarak temsil eder; bu sayede sözlükte olmayan kelimeler ve morfolojik varyantlar için de vektör üretilebilir","FastText transformer tabanlı bir modeldir","FastText yalnızca İngilizce için geliştirilmiştir"],ans:1,exp:"FastText kelimeyi karakter n-gramlarına (alt kelime parçalarına) bölerek öğrenir. Bu yaklaşım, eğitim verisinde görülmemiş kelimeleri ve eklemeli dillerdeki kelime varyantlarını (Türkçe gibi) daha iyi temsil etmesini sağlar."},
{text:"Metin madenciliğinde bir sınıflandırma görevi için BERT mi yoksa GPT mi daha uygun bir seçimdir ve neden?",tag:"analyze",opts:["GPT, çünkü daha büyük bir modeldir","BERT, çünkü encoder mimarisiyle cümlenin tamamını çift yönlü analiz ederek anlama ve sınıflandırma görevlerinde daha etkili embedding üretir","GPT, çünkü autoregressive yapısı sınıflandırmayı kolaylaştırır","BERT, çünkü yalnızca kısa metinlerde çalışır ve sınıflandırma için yeterlidir"],ans:1,exp:"Sınıflandırma bir 'anlama' görevidir. BERT'in çift yönlü encoder mimarisi cümlenin tamamını analiz ederek güçlü bağlamsal embedding üretir. GPT ise önceki tokenlara bakan decoder mimarisiyle metin üretmeye yönelik tasarlanmıştır; anlama görevlerinde BERT daha uygundur."},



{text:"Bir e-ticaret firması ürün yorumlarından hem genel memnuniyeti hem de kargo, ürün kalitesi ve fiyat gibi özelliklere ait ayrı ayrı duyguları çıkarmak istiyor. Hangi duygu analizi türü bu ihtiyaca en uygun yanıtı verir?",tag:"mixed",opts:["Kutupluluk analizi","İkili duygu analizi","Görünüş/özellik tabanlı duygu analizi (Aspect-Based)","Öznellik analizi"],ans:2,exp:"Aspect-Based Sentiment Analysis, belirli özellikler (kargo, kalite, fiyat) hakkındaki duyguları ayrı ayrı belirler. Genel duygu analizi tüm yorumu tek bir sınıfa koyarken bu yöntem özellik bazında ayrıntılı bilgi verir."},
{text:"Bir spam filtresi 'Bu linke sakın tıklamayın, dolandırıcılık olabilir.' mesajını spam olarak işaretledi. Bu hatanın adı nedir ve hangi yöntem bunu önlemede daha başarılıdır?",tag:"mixed",opts:["False negative; sözlük tabanlı yöntem","False positive (yanlış alarm); transformer tabanlı yöntem bağlamı anlayarak bu hatayı azaltabilir","True positive; kural tabanlı yöntem","False negative; N-gram tabanlı yöntem"],ans:1,exp:"Masum bir mesajı spam olarak işaretlemek false positive (yanlış alarm) hatasıdır. Transformer modelleri bağlamı değerlendirebilir ve uyarı amaçlı mesajları spam'den ayırt edebilir; kural ve sözlük tabanlı yöntemler ise yalnızca kelimelere bakarak bu hatayı yapar."},
{text:"TF-IDF ile BERT embedding arasındaki en kritik fark aşağıdakilerden hangisidir?",tag:"mixed",opts:["TF-IDF daha yavaş çalışır","TF-IDF yalnızca kelime ağırlıkları üretir ve bağlam bilgisi taşımazken, BERT aynı kelime için bağlama göre farklı vektörler üretir","BERT yalnızca İngilizce için çalışır","TF-IDF daha fazla parametre gerektirir"],ans:1,exp:"TF-IDF bir kelimenin metin içindeki sayısal önemini gösterir; anlam veya bağlam bilgisi taşımaz. BERT ise transformer mimarisiyle aynı kelimenin farklı bağlamlardaki anlamlarını ayrı vektörlerle temsil edebilir."},
{text:"Abstractive özetleme yapan bir model 'Şehirde şiddetli yağış yaşandı' yerine 'Şehirde kuraklık sorunu yaşandı' üretirse bu nasıl adlandırılır ve hangi model türünde daha sık görülür?",tag:"mixed",opts:["Extractive hata; Word2Vec tabanlı modellerde","Halüsinasyon; büyük dil modeli (LLM) tabanlı soyutlayıcı özetleme modellerinde","Tokenizasyon hatası; BERT tabanlı modellerde","Overfitting; klasik makine öğrenmesi modellerinde"],ans:1,exp:"Modelin metinde olmayan bilgileri üretmesine halüsinasyon denir. Bu problem özellikle büyük dil modeli tabanlı abstractive özetleme sistemlerinde görülür çünkü bu modeller yeni cümleler üretir ve kaynak bilgiden sapabilir."},
{text:"Bir akademik dergi, gönderilen makalede %42 benzerlik oranı tespit etti. Bu oran otomatik olarak intihal kararı için yeterli midir?",tag:"mixed",opts:["Evet, %30 üzeri her oran intihale işaret eder","Hayır; kaynakça, teknik terimler, alıntılar ve standart ifadeler oranı artırabilir. İnsan değerlendirmesi şarttır","Evet, yalnızca %50 altındaki oranlar kabul edilebilir","Hayır, %80 altı tüm oranlar intihal sayılmaz"],ans:1,exp:"Benzerlik oranı tek başına intihal kararı için yeterli değildir. Kaynakça bölümü, metot isimleri, teknik terimler veya doğru kaynak gösterilen alıntılar benzerlik oranını artırabilir. Son karar uzman tarafından verilmelidir."},
{text:"'Takım ekonomik kriz nedeniyle transfer yapamadı.' cümlesi metin sınıflandırmada neden zorluk yaratır?",tag:"mixed",opts:["Cümle çok uzundur","Cümlede hem spor hem ekonomi anahtar kelimeleri bulunur; basit yöntemler kategoriyi karıştırabilir","Cümlede olumsuzluk eki vardır","Cümle öznel bir görüş içermektedir"],ans:1,exp:"Bu cümlede 'takım' ve 'transfer' spor kategorisini, 'ekonomik kriz' ise ekonomi kategorisini işaret eder. Basit kelime tabanlı yöntemler bu iki sinyali karıştırabilir; transformer modelleri cümlenin bütününü değerlendirerek daha iyi karar verebilir."},
{text:"Bir kullanıcı 'Ürün efsaneee 🔥' yazdığında klasik duygu analizi yöntemleri neden zorlanabilir?",tag:"mixed",opts:["Cümle çok kısadır","Emoji ve argo içeren, yazım hatası barındıran bu tür sosyal medya metinleri klasik sözlük ve kural tabanlı yöntemleri zorlar","Cümle nesnel bir bilgi içermektedir","Bu cümle olumsuz duygu taşımaktadır"],ans:1,exp:"Sosyal medya metinlerinde emoji, argo, uzatılmış harf yazımı ('efsaneee') ve yazım hataları çok sıktır. Klasik sözlük tabanlı yöntemler bu tür ifadeleri tanımakta zorlanırken derin öğrenme modelleri bu verilerden öğrenebilir."},
{text:"GPT ve BERT modellerini karşılaştırdığımızda, hangisi duygu analizi görevi için mimarisi itibarıyla daha uygun tasarlanmıştır?",tag:"mixed",opts:["GPT; çünkü autoregressive yapısı duygu etiketlerini üretir","BERT; çünkü çift yönlü encoder mimarisiyle cümlenin tüm bağlamını analiz ederek sınıflandırma görevlerine daha uygundur","İkisi eşit düzeyde uygundur","GPT; çünkü daha büyük bir modeldir"],ans:1,exp:"BERT encoder mimarisiyle cümleyi hem soldan hem sağdan analiz ederek güçlü bağlamsal temsil üretir; bu yapı sınıflandırma ve duygu analizi görevleri için idealdir. GPT decoder mimarisiyle metin üretmeye odaklanır."},
{text:"İntihal tespitinde N-gram yönteminin tam eşleşme yöntemine göre avantajı nedir?",tag:"mixed",opts:["N-gram yöntemi daha az bellek kullanır","N-gram yöntemi kısmi kopyalamaları ve kelime sırasını değiştirilerek yapılan intihalleri yakalayabilir","N-gram yöntemi parafraz intihali için mükemmeldir","N-gram yöntemi çeviri intihali tespitinde etkilidir"],ans:1,exp:"Tam eşleşme yöntemi yalnızca birebir kopyaları bulur. N-gram yöntemi ise ardışık kelime gruplarını karşılaştırdığı için kelime sırası değiştirilerek veya kısmen değiştirilerek yapılan intihalleri de yakalayabilir. Ancak parafraz ve çeviri intihali için yetersiz kalır."},
{text:"Metin sınıflandırmada 'ikili sınıflandırma' ile 'çok sınıflı sınıflandırma' arasındaki fark nedir?",tag:"concept",opts:["İkili sınıflandırma daha az veri gerektirir","İkili sınıflandırmada metin yalnızca iki sınıftan birine atanırken, çok sınıflı sınıflandırmada birden fazla sınıf arasından biri seçilir","İkili sınıflandırma yalnızca spam tespiti için kullanılır","Çok sınıflı sınıflandırmada metin birden fazla etikete sahip olabilir"],ans:1,exp:"İkili sınıflandırmada yalnızca iki sınıf (spam/normal, olumlu/olumsuz) vardır. Çok sınıflı sınıflandırmada spor, ekonomi, sağlık, teknoloji gibi birden fazla sınıf vardır ve metin bunlardan yalnızca birine atanır. Çok etiketli sınıflandırmayla karıştırılmamalıdır."},
{text:"Attention mekanizmasında dot product hesabı ne için kullanılır?",tag:"concept",opts:["Kelimelerin frekansını saymak için","Bir kelimenin cümledeki diğer kelimelere ne kadar dikkat etmesi gerektiğini (attention skorunu) hesaplamak için","Kelimeleri alfabetik sıralamak için","Stop-word'leri temizlemek için"],ans:1,exp:"Attention mekanizmasında Query (Q) ve Key (K) vektörlerinin dot product'ı hesaplanır. Bu işlem, bir kelimenin diğer kelimelere ne kadar dikkat etmesi gerektiğini gösteren attention skorlarını üretir. Yüksek skor = daha fazla dikkat."},
{text:"Haber metinlerinde otomatik özet çıkarırken ilk cümlelere daha yüksek önem skoru verilmesinin gerekçesi nedir?",tag:"analyze",opts:["İlk cümleler her zaman en kısa cümlelerdir","Haber yazımında 'ters piramit' yapısına göre en önemli bilgiler genellikle ilk cümlelerde yer alır","İlk cümleler daha fazla anahtar kelime içerir","Modelin ilk cümleleri okumak için daha az hesaplama gücü gerektirir"],ans:1,exp:"Haber metinlerinde geleneksel 'ters piramit' yapısı gereği en kritik bilgiler (ne, nerede, ne zaman, kim) genellikle ilk cümlelerde verilir. Bu nedenle haber özetlemesinde cümle konumu önemli bir önem faktörü olarak kullanılır."},
{text:"Bir metin madenciliği projesinde Türkçe metinlerde 'güzelleştiremediklerimizden' kelimesinin kökünü bulmak neden zordur?",tag:"analyze",opts:["Kelime çok uzun olduğu için sistem belleği yetersiz kalır","Türkçenin eklemeli yapısı nedeniyle kelime çok sayıda ek almış; kök bulma ve lemmatization algoritmaları tüm ek kombinasyonlarını doğru işlemek zorundadır","Bu kelime Türkçe sözlüklerde yer almaz","Kelimede yabancı köken bulunmaktadır"],ans:1,exp:"Türkçe eklemeli bir dildir; bir kök üzerine birden fazla ek gelebilir. 'Güzelleştiremediklerimizden' gibi kelimeler kök bulma ve lemmatization algoritmalarını zorlar çünkü olası ek kombinasyonları çok fazladır ve her dil katmanının doğru işlenmesi gerekir."},
{text:"BART ve Pegasus gibi encoder-decoder modelleri neden özetleme görevinde encoder-only modellerden daha başarılıdır?",tag:"analyze",opts:["Daha az parametre kullanırlar","Encoder girdiyi anlarken decoder yeni ve kısa cümleler üretebilir; bu yapı abstractive özetleme için idealdir","Yalnızca extractive özetleme yaparlar","Encoder-only modeller özetleme desteklemez"],ans:1,exp:"Encoder-decoder mimarisinde encoder kaynak metni anlar, decoder ise bu anlayışa dayanarak yeni ve öz cümleler üretir. Bu yapı abstractive özetleme için idealdir. Encoder-only modeller (BERT) yeni cümle üretemez; extractive görevlerde cümle temsili için kullanılabilir."},
{text:"Metin madenciliğinde 'stop-word temizleme' adımının amacı nedir?",tag:"concept",opts:["Metindeki tüm sıfatları silmek","'ve', 'ile', 'bu' gibi çok sık geçen ama sınıflandırma için ayırt edici değeri olmayan kelimeleri çıkarmak","Metindeki tüm sayıları silmek","Metni cümlelere ayırmak"],ans:1,exp:"Stop-word'ler ('ve', 'ile', 'bu', 'bir' gibi) her metinde çok sık geçer ama sınıflandırma veya analiz için ayırt edici bilgi taşımaz. Bu kelimeleri temizlemek modelin daha anlamlı kelimelere odaklanmasını sağlar ve hesaplama yükünü azaltır."},
{text:"Word2Vec ve BERT'i aynı görevde kullanırken hangi durumda Word2Vec tercih edilebilir?",tag:"analyze",opts:["Her zaman BERT tercih edilmelidir","Hesaplama kaynakları kısıtlıysa veya bağlam bağımsız kelime temsili yeterliyse Word2Vec daha hafif ve hızlı bir alternatiftir","Word2Vec transformer modellerinden her zaman daha doğru sonuç verir","Word2Vec yalnızca Türkçe için uygundur"],ans:1,exp:"BERT güçlü bağlamsal temsil üretir ancak hesaplama maliyeti yüksektir. Kaynaklar kısıtlıysa veya görev bağlam bağımsız kelime temsili ile çözülebiliyorsa (örn. basit kelime benzerliği), Word2Vec daha hafif ve pratik bir seçenek olabilir."},
{text:"Duygu analizinde 'duygu yoğunluğu analizi' ile 'kutupluluk analizi' arasındaki fark nedir?",tag:"concept",opts:["İkisi tamamen aynı şeydir","Kutupluluk analizi genel olumlu/olumsuz/nötr sınıflandırması yaparken, duygu yoğunluğu analizi duygunun şiddetini de (hafif olumlu, güçlü olumlu gibi) ölçer","Duygu yoğunluğu analizi yalnızca olumsuz metinlerde kullanılır","Kutupluluk analizi yalnızca sosyal medya verilerine uygulanır"],ans:1,exp:"Kutupluluk analizi bir metnin genel duygusunu olumlu, olumsuz veya nötr olarak sınıflandırır. Duygu yoğunluğu analizi ise bunun ötesine geçerek duygunun şiddetini de ölçer: 'Ürünü beğendim' hafif olumlu, 'Ürüne bayıldım, harika!' ise güçlü olumlu olarak ayrışır."},
{text:"Metin sınıflandırmada eğitim aşamasında 'Spor' kategorisi için 5000, 'Eğitim' kategorisi için yalnızca 300 örnek var. Bu durumda model büyük ihtimalle ne yapar?",tag:"apply",opts:["Her iki kategoriyi eşit başarıyla öğrenir","Yeni metinleri büyük olasılıkla 'Spor' olarak sınıflandırma eğilimi gösterir; 'Eğitim' kategorisini öğrenmekte zorlanır","Eğitimi durdurur ve hata verir","'Eğitim' kategorisini daha iyi öğrenir çünkü az veri dikkatli seçilmiştir"],ans:1,exp:"Veri dengesizliği durumunda model az örneğe sahip kategoriyi yeterince öğrenemez ve tahminlerini çoğunlukla büyük kategoriye yöneltir. Bu problemi çözmek için veri artırma (augmentation), oversampling veya sınıf ağırlıklandırma teknikleri kullanılabilir."},
{text:"Kod intihali tespitinin metin intihali tespitinden farkı nedir?",tag:"analyze",opts:["Kod intihali tespiti daha basittir çünkü kodlar sabittir","Kodda değişken adları değiştirilerek kolayca gizlenebilir; bu nedenle kelime eşleşmesinin yanı sıra kodun yapısal ve algoritmik benzerliği (soyut sözdizim ağacı) de analiz edilmelidir","Kod intihali tespitinde TF-IDF yöntemi kullanılmaz","Kod intihali tespiti insan değerlendirmesi gerektirmez"],ans:1,exp:"Kod intihali tespitinde değişken adları, yorum satırları veya satır sırası kolayca değiştirilebilir. Bu yüzden sadece metinsel benzerliğe bakmak yeterli değildir; kodun akış mantığı, kontrol yapıları ve soyut sözdizim ağacı gibi yapısal benzerlikler de incelenmelidir."},
{text:"Aşağıdaki görev-model eşleştirmelerinden hangisi en doğrudur?",tag:"mixed",opts:["Metin üretme → BERT, Özetleme → GPT, Sınıflandırma → T5","Sınıflandırma/Duygu analizi → BERT, Metin üretme/Chatbot → GPT, Özetleme → Pegasus/BART","Özetleme → GPT, Sınıflandırma → Pegasus, Metin üretme → BERT","Tüm görevler için BERT en uygun modeldir"],ans:1,exp:"BERT encoder mimarisiyle sınıflandırma ve duygu analizi gibi anlama görevlerinde öne çıkar. GPT decoder mimarisiyle metin üretme ve chatbot uygulamalarında güçlüdür. Pegasus ve BART ise encoder-decoder mimarileriyle özellikle özetleme görevleri için tasarlanmıştır."}





];
const tagLabel={concept:"Kavram",apply:"Uygulama",analyze:"Analiz"};
const tagClass={concept:"tag-concept",apply:"tag-apply",analyze:"tag-analyze"};
const letters=["A","B","C","D"];
const userAnswers=new Array(20).fill(-1);

function render(){
const c=document.getElementById("questions");c.innerHTML="";
questions.forEach((q,qi)=>{
const b=document.createElement("div");b.className="qblock";b.id="q"+qi;
b.innerHTML=`<div class="qheader"><div class="qnum">${qi+1}</div><div class="qtext">${q.text}</div><span class="qtag ${tagClass[q.tag]}">${tagLabel[q.tag]}</span></div><div class="opts" id="opts${qi}"></div><div class="exp" id="exp${qi}">${q.exp}</div>`;
c.appendChild(b);
const opts=document.getElementById("opts"+qi);
q.opts.forEach((o,oi)=>{
const d=document.createElement("div");d.className="opt";
d.setAttribute("data-qi",qi);d.setAttribute("data-oi",oi);
d.innerHTML=`<div class="opt-letter">${letters[oi]}</div><span>${o}</span>`;
d.onclick=()=>selectOpt(qi,oi);opts.appendChild(d);
});
});
}

function selectOpt(qi,oi){
if(userAnswers[qi]!==-1)return;
userAnswers[qi]=oi;
document.querySelectorAll(`[data-qi="${qi}"]`).forEach(o=>{
const idx=parseInt(o.getAttribute("data-oi"));
if(idx===questions[qi].ans)o.classList.add("correct");
else if(idx===oi)o.classList.add("wrong");
});
document.getElementById("exp"+qi).style.display="block";
updateStats();
}

function updateStats(){
const ans=userAnswers.filter(a=>a!==-1&&a!==-2).length;
const cor=userAnswers.filter((a,i)=>a===questions[i].ans).length;
document.getElementById("s-answered").textContent=ans;
document.getElementById("s-correct").textContent=cor;
document.getElementById("s-score").textContent=cor*5;
document.getElementById("progress").style.width=Math.round(userAnswers.filter(a=>a!==-1).length/20*100)+"%";
}

function checkAll(){
questions.forEach((q,qi)=>{
if(userAnswers[qi]===-1){
userAnswers[qi]=-2;
document.querySelectorAll(`[data-qi="${qi}"]`).forEach(o=>{
if(parseInt(o.getAttribute("data-oi"))===q.ans)o.classList.add("correct");
});
document.getElementById("exp"+qi).style.display="block";
}
});
updateStats();
}

function resetAll(){
userAnswers.fill(-1);render();updateStats();
document.getElementById("result-box").innerHTML="";
}

function showResult(){
const cor=userAnswers.filter((a,i)=>a!==-1&&a!==-2&&a===questions[i].ans).length;
const ans=userAnswers.filter(a=>a!==-1&&a!==-2).length;
const pct=ans?Math.round(cor/ans*100):0;
let msg=pct>=85?"Mükemmel! Konulara çok iyi hakimsiniz.":pct>=70?"İyi bir performans. Birkaç konuya tekrar bakabilirsiniz.":pct>=50?"Orta düzey. Konuları tekrar gözden geçirmenizi öneririm.":"Daha fazla çalışma gerekiyor. Notlarınızı tekrar okuyun.";
document.getElementById("result-box").innerHTML=`<div class="result"><div class="result-score">${cor*5} / 100</div><div style="font-size:16px;font-weight:500;margin-bottom:8px">${cor} / ${ans} doğru cevap</div><div class="result-msg">${msg}</div></div>`;
document.getElementById("result-box").scrollIntoView({behavior:"smooth"});
}

render();
</script>
</body>
</html>
