                    { text: "Security: B, Maintainability: B", correct: false, rationale: "Harf notları raporda spesifik olarak D ve A olarak ölçülmüştür." },
                    { text: "Security: E, Maintainability: C", correct: false, rationale: "Reliability notu C, Security Review notu E'dir; ancak Security ana notu D, Maintainability notu ise A'dır." }
                ]
            }
        ];

        const container = document.getElementById('quiz-container');

        quizData.forEach((q) => {
            const card = document.createElement('div');
            card.className = 'quiz-card';

            const title = document.createElement('div');
            title.className = 'question-title';
            title.innerText = `Soru ${q.number}: ${q.question}`;
            card.appendChild(title);

            const optionsList = document.createElement('ul');
            optionsList.className = 'options-list';

            const rationaleDiv = document.createElement('div');
            rationaleDiv.className = 'rationale';

            q.options.forEach((opt) => {
                const li = document.createElement('li');
                li.className = 'option-item';
                li.innerText = opt.text;

                li.addEventListener('click', () => {
                    // Şıkları kilitle
                    Array.from(optionsList.children).forEach(item => {
                        item.classList.add('disabled');
                    });
                    
                    if (opt.correct) {
                        li.classList.add('correct');
                        rationaleDiv.style.borderLeftColor = 'var(--success-color)';
                        rationaleDiv.innerHTML = `<strong>Doğru!</strong> <br>${opt.rationale}`;
                    } else {
                        li.classList.add('incorrect');
                        rationaleDiv.style.borderLeftColor = 'var(--danger-color)';
                        rationaleDiv.innerHTML = `<strong>Yanlış Cevap!</strong> <br>${opt.rationale}<br><br><em>Doğru şıkkı bulmak için rasyonelleri inceleyin.</em>`;
                        
                        // Doğru olanı da göster
                        Array.from(optionsList.children).forEach((item, index) => {
                            if (q.options[index].correct) {
                                item.classList.add('correct');
                            }
                        });
                    }
                    rationaleDiv.style.display = 'block';
                });

                optionsList.appendChild(li);
            });

            card.appendChild(optionsList);
            card.appendChild(rationaleDiv);
            container.appendChild(card);
        });
    </script>
</body>
</html>
