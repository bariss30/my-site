

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-sans)}
.wrap{padding:1.5rem 1rem;max-width:720px;margin:0 auto}
h1{font-size:20px;font-weight:500;color:var(--color-text-primary);margin-bottom:4px}

.progress-bar-bg{height:6px;background:var(--color-background-secondary);border-radius:4px;margin-bottom:1.5rem;overflow:hidden}
.progress-bar-fill{height:6px;background:#1D9E75;border-radius:4px;transition:width 0.4s}

.stat{background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:10px 8px;text-align:center}
.stat-n{font-size:20px;font-weight:500;color:var(--color-text-primary)}
.stat-l{font-size:11px;color:var(--color-text-secondary);margin-top:2px}
.q-card{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);padding:1.25rem;margin-bottom:1rem}
.q-meta{font-size:11px;color:var(--color-text-tertiary);margin-bottom:8px;display:flex;gap:8px;align-items:center}
.badge{padding:2px 8px;border-radius:20px;font-size:11px;font-weight:500}
.b-erp{background:#E1F5EE;color:#0F6E56}
.b-pm{background:#E6F1FB;color:#185FA5}
.q-text{font-size:15px;color:var(--color-text-primary);margin-bottom:1rem;line-height:1.6}
.options{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);cursor:pointer;transition:all 0.15s;background:var(--color-background-primary)}
.opt:hover{background:var(--color-background-secondary);border-color:var(--color-border-secondary)}
.opt.selected{border-color:#378ADD;background:#E6F1FB}
.opt.correct{border-color:#1D9E75;background:#E1F5EE}
.opt.wrong{border-color:#E24B4A;background:#FCEBEB}
.opt-letter{width:22px;height:22px;border-radius:50%;border:1px solid var(--color-border-secondary);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:500;color:var(--color-text-secondary);flex-shrink:0;margin-top:1px}
.opt.correct .opt-letter{background:#1D9E75;color:white;border-color:#1D9E75}
.opt.wrong .opt-letter{background:#E24B4A;color:white;border-color:#E24B4A}

.explanation{margin-top:12px;padding:10px 12px;background:var(--color-background-secondary);border-left:3px solid #1D9E75;border-radius:0 var(--border-radius-md) var(--border-radius-md) 0;font-size:13px;color:var(--color-text-secondary);line-height:1.6;display:none}
.explanation.show{display:block}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:1.5rem}
.btn{padding:8px 18px;border-radius:var(--border-radius-md);border:0.5px solid var(--color-border-secondary);background:var(--color-background-primary);font-size:14px;cursor:pointer;color:var(--color-text-primary);transition:all 0.15s}
.btn:hover{background:var(--color-background-secondary)}
.btn-primary{background:#1D9E75;color:white;border-color:#1D9E75}
.btn-primary:hover{background:#0F6E56}
.result-card{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);padding:2rem;text-align:center;display:none}
.score-big{font-size:48px;font-weight:500;color:var(--color-text-primary)}
.score-msg{font-size:16px;color:var(--color-text-secondary);margin-top:8px}
.wrong-list{text-align:left;margin-top:1.5rem}
.wrong-item{padding:8px 0;border-bottom:0.5px solid var(--color-border-tertiary);font-size:13px;color:var(--color-text-secondary);line-height:1.5}
.wrong-item strong{color:var(--color-text-primary);display:block;margin-bottom:2px}
</style>

<script>
const Qs=[
{t:"ERP",q:"SAP sistemlerinde test yapmanın temel nedenlerinden biri olan 'iş sürekliliği' ne anlama gelir?",opts:["Sistemin günlük yedeklenmesi","Kritik iş süreçlerinin kesintisiz çalışmasının güvence altına alınması","Tüm çalışanların sisteme erişiminin sağlanması","Yazılım lisanslarının zamanında yenilenmesi"],a:1,exp:"İş sürekliliği, bir SAP sistemindeki arıza veya hata durumunda bile temel iş süreçlerinin (finans, üretim, satış vb.) çalışmaya devam edebilmesini ifade eder. Bu yüzden test süreci kritik önem taşır."},
{t:"ERP",q:"Bir yazılım hatasının gereksinim planlama aşamasında bulunması ile üretim aşamasında bulunması arasındaki maliyet farkı yaklaşık olarak nedir?",opts:["Hata maliyetleri her aşamada eşittir","Üretimde bulunan hata ~100x daha pahalıdır","Üretimde bulunan hata ~10x daha pahalıdır","Gereksinim aşamasında bulmak daha pahalıdır"],a:1,exp:"Ders materyalinde gösterildiği üzere: Gereksinim aşamasında = ~$100, Test aşamasında = ~$1.500, Üretimde = ~$10.000. Bu nedenle hataları erken yakalamak kritik öneme sahiptir."},
{t:"ERP",q:"SAP'de ABAP Unit test sınıfı tanımlarken kullanılan 'FOR TESTING' ifadesi ne işe yarar?",opts:["Kodun test ortamında çalışacağını belirtir","Sınıfın veya metodun bir test sınıfı/metodu olduğunu SAP'e bildirir","Testin otomatik çalışmasını sağlar","Test sonuçlarının loglanmasını sağlar"],a:1,exp:"ABAP Unit'te bir sınıfın 'CLASS ltcl_test DEFINITION FOR TESTING' şeklinde tanımlanması, bu sınıfın üretim koduna dahil olmayacağını ve sadece test amaçlı kullanılacağını gösterir. Metod seviyesinde de 'METHODS my_test FOR TESTING' şeklinde uygulanabilir."},
{t:"ERP",q:"ABAP Unit testinde 'RISK LEVEL HARMLESS' ne anlama gelir?",opts:["Testin çok hızlı çalışacağı anlamına gelir","Testin sistem verilerine zarar vermeyeceği, yalnızca okuma yapacağı anlamına gelir","Testin yalnızca sandbox ortamında çalışabileceği anlamına gelir","Testin başarısız olsa bile hata fırlatmayacağı anlamına gelir"],a:1,exp:"RISK LEVEL, testin sistem verilerine ne ölçüde etki edebileceğini tanımlar. HARMLESS = veri değişikliği yok (salt okuma). DANGEROUS = veri değişikliği olabilir. Bu SAP'in test güvenliği için kullandığı bir sınıflandırmadır."},
{t:"ERP",q:"ABAP Unit'te 'cl_abap_unit_assert=>assert_equals' metodunun 'act' ve 'exp' parametreleri neyi temsil eder?",opts:["act = eylem tipi, exp = açıklama metni","act = gerçekleşen değer, exp = beklenen değer","act = aktif kullanıcı, exp = beklenti seviyesi","act = hata kodu, exp = hata mesajı"],a:1,exp:"assert_equals metodunda: act (actual) = test edilen kodun gerçekte ürettiği değer; exp (expected) = sizin beklediğiniz değer. İkisi eşit değilse test başarısız sayılır ve hata mesajı üretilir."},
{t:"ERP",q:"Tricentis Tosca'nın SAP test otomasyonunda tercih edilmesinin temel nedeni nedir?",opts:["Tamamen ücretsiz ve açık kaynaklı olması","Scriptless (kodsuz) otomasyon ve model tabanlı yaklaşım sunması","Yalnızca web tabanlı uygulamaları test edebilmesi","SAP tarafından doğrudan üretilmiş olması"],a:1,exp:"Tosca, scriptless otomasyon sayesinde kod yazmadan test oluşturulmasına imkân tanır. Model tabanlı yaklaşım, arayüz değişikliklerinde testlerin kolayca güncellenmesini sağlar. Ayrıca SAP ile stratejik ortaklığı bulunmaktadır."},
{t:"ERP",q:"SAP Fiori'de OData servisi nasıl tanımlanır?",opts:["SAP'nin özel veri tabanı formatı","HTTP üzerinden REST mimarisine dayalı, standart bir veri erişim protokolü","Fiori uygulamalarını güvenli kılan şifreleme katmanı","SAP sistemleri arasında veri senkronizasyonu sağlayan araç"],a:1,exp:"OData (Open Data Protocol), HTTP üzerinden GET/POST gibi standart isteklerle veri okuma ve yazma imkânı sunar. SAP Fiori uygulamaları arka uç SAP sistemine OData servisleri aracılığıyla bağlanır, JSON formatında veri alışverişi yapar."},
{t:"ERP",q:"SAP Fiori uygulamaları geliştirmek için kullanılan iki temel araç hangisidir?",opts:["Eclipse ve IntelliJ IDEA","VS Code ve SAP Business Application Studio","PyCharm ve NetBeans","SAP GUI ve SAP Logon"],a:1,exp:"Fiori/SAPUI5 geliştirme için iki ana araç kullanılır: VS Code (Microsoft'un popüler editörü, eklentilerle desteklenir) ve SAP Business Application Studio (bulut tabanlı SAP'nin resmi geliştirme ortamı)."},
{t:"ERP",q:"SAP'de 'Z'li geliştirmeler' neden test sürecini daha da önemli kılar?",opts:["Z geliştirmeler her güncellemeyle otomatik güncellenir","Standart SAP testleri Z geliştirmeleri kapsamaz, özel test yazılması gerekir","Z geliştirmeler yalnızca eklenti katmanında çalışır","Z geliştirmeler düşük maliyetli olduğundan test gerekmez"],a:1,exp:"Z ile başlayan ABAP geliştirmeleri müşteriye özel özelleştirmelerdir. SAP'nin kendi regresyon testleri bu kodları kapsamaz. Ayrıca sistem güncellemeleri sonrası Z kodların düzgün çalışmaya devam ettiğinin doğrulanması gerekir."},
{t:"ERP",q:"Playwright test otomasyon aracının 'Codegen' özelliği ne yapar?",opts:["Test senaryolarını yapay zekâ ile otomatik oluşturur","Tarayıcıdaki kullanıcı etkileşimlerini kaydederek otomatik olarak çalışabilir test kodu üretir","Mevcut testleri optimize ederek hızlandırır","Test sonuçlarını görsel rapora dönüştürür"],a:1,exp:"Playwright Codegen, kullanıcının tarayıcıda gerçekleştirdiği tıklama, yazma ve gezinme eylemlerini izleyerek TypeScript/JavaScript/Python/Java dillerinden birinde çalıştırılabilir test kodu üretir. Prototip geliştirmeyi büyük ölçüde hızlandırır."},
{t:"PM",q:"Turkcell proje yönetimi sürecinde 'Talep Olgunlaştırma Dokümanı (TOD)' ne zaman hazırlanır?",opts:["Proje kapanışında özet olarak","Proje açılışı öncesinde, talebin onaya gönderilmesinden önce","TTD review toplantısı tamamlandıktan sonra","Devreye alım planı hazırlanırken"],a:1,exp:"TOD, projenin ön değerlendirme aşamasında hazırlanır ve proje açılış kararından önce onaylanmış olmalıdır. TOD; amacı, gereksinimleri, KPI'ları, kapsam dışındaki konuları ve tahmini maliyeti içermelidir."},
{t:"PM",q:"Proje sürecindeki 'Baseline 1' ne zaman alınır ve neyi gösterir?",opts:["Devreye alım sonrası; gerçek bitiş tarihini gösterir","Analiz başlangıcında; analiz için taahhüt edilen tarihleri gösterir","TTD sonrası; tüm fazların kesin tarihlerini gösterir","Proje kapanışında; planlı-gerçekleşen farkı gösterir"],a:1,exp:"Baseline 1, analiz fazı başlangıcında alınır. Bu noktada analiz tarihleri nettir, ancak geliştirme/test/lansman tarihleri hâlâ taslak durumdadır. Projenin bu anlık fotoğrafı ilerleyen dönemlerde sapma analizinde referans noktası olur."},
{t:"PM",q:"Turkcell proje sürecinde 'AD Review' toplantısı neyin sonrasında gerçekleşir?",opts:["TTD hazırlandıktan sonra","Analiz dokümanı tamamlandıktan sonra","Devreye alım planı hazırlandıktan sonra","Geliştirme fazı bitişinde"],a:1,exp:"Süreç sırası: Analiz → AD Review → Tasarım → TTD Review → Geliştirme → Testler → Devreye Alım → Lansman. AD (Analiz Dokümanı) Review, analizin tamamlandığını ve müşteri, HLS, Operasyon, Fraud, Security onaylarının alındığını teyit eder."},
{t:"PM",q:"'TTD Review' toplantısı sonrasında ne olur?",opts:["Proje kapatılır ve değerlendirme başlar","Geliştirme ve test zaman planı kesinleşir; Baseline 2 alınır","Müşteriden talep olgunlaştırma onayı alınır","Devreye alım planı BT yöneticisine sunulur"],a:1,exp:"TTD (Teknik Tasarım Dokümanı) Review onayı sonrası: geliştirme ve test tarihlerini içeren Baseline 2 alınır (Baseline 1'in yerini alır), BA Test ve UAT adımları plana eklenir, talep sahibine taahhüt edilecek lansman tarihi netleşir."},
{t:"PM",q:"Proje sürecinde 'Release Takvimi' ne işe yarar?",opts:["Proje ekibinin tatil planlarını yönetir","Bazı altyapıların devreye alımlarını standart, kontrollü bir takvime bağlar","Test senaryolarının hangi sırada çalışacağını belirler","Proje bütçesinin aylık dağılımını gösterir"],a:1,exp:"Release Takvimi, kod dondurma ve üretim ortamına geçiş tarihlerini sabit bir yıllık plan içinde organize eder. Bu sayede sistem değişiklikleri kontrollü ve öngörülebilir şekilde yapılabilir; beklenmedik çakışmalar önlenir."},
{t:"PM",q:"'Devreye alım' ile 'lansman' kavramları arasındaki fark nedir?",opts:["İkisi de aynı anlama gelir, birbirinin yerine kullanılabilir","Devreye alım = canlı ortama geçiş; lansman = son kullanıcıya sunuş. Tarihleri farklı olabilir","Lansman teknik ekip için, devreye alım müşteri için kullanılan kavramdır","Devreye alım yalnızca donanım için kullanılır"],a:1,exp:"Devreye alım: geliştirilen ürün/servisin canlı (production) ortama alınmasıdır, teknik bir adımdır. Lansman: ürünün son aboneye/kullanıcıya sunulduğu andır. Aralarında UAT veya pilot run gibi aşamalar bulunabileceğinden tarihleri farklı olabilir."},
{t:"PM",q:"Proje sürecinde 'OKP (Operasyonel Kontroller Planı)' ne zaman hazırlanır ve kim koordine eder?",opts:["Proje açılışında PM tarafından","Test başlangıcında OFL koordinasyonuyla","Devreye alım sırasında geliştirme ekibi tarafından","Proje kapanışında talep sahibi tarafından"],a:1,exp:"OKP, test fazına geçilmeden önce OFL (Operasyon Faz Lideri) koordinasyonuyla hazırlanır. OKP Review'un PRP (PreProduction) aşamasından önce tamamlanmış olması zorunludur. Devreye alımdan kapanışa kadar OFL bu kontrollerin yapılmasından sorumludur."},
{t:"PM",q:"'Change Request (CR)' sürecinde hangi kriterler değerlendirilerek CR'ın projeye alınıp alınmayacağına karar verilir?",opts:["Yalnızca maliyet kriteri belirleyicidir","Maliyet, süre, lansmanı etkileme durumu ve proje safhası uygunluğu","Sadece teknik uygulanabilirlik ve süre","Proje yöneticisinin takdir yetkisi yeterlidir"],a:1,exp:"CR değerlendirme kriterleri: (1) Maliyet karşılanabilir mi? (2) Süre planı etkileniyor mu? (3) Lansmanı engelliyor ya da zorunlu kılıyor mu? (4) Proje safhası CR için uygun mu? Tüm kriterler olumlu ise CR alınır; aksi hâlde yeni proje veya fast-track olarak ilerlenebilir."},
{t:"PM",q:"Proje sürecinde kaç tür proje testi vardır ve bunlar hangi sırayla gerçekleşir?",opts:["2 tür: Entegrasyon ve UAT","4 tür; Entegrasyon → BA Test → UAT → Pilot Run (uygulanabilirse)","2 tür; UAT sonra Entegrasyon","3 tür; Unit → Entegrasyon → Sistem testi"],a:1,exp:"Sıra: Entegrasyon Testleri (test ekibi, farklı altyapı entegrasyonlarını kontrol eder) → BA Testleri (analistler tarafından) → UAT Testleri (talep sahibi tarafından) → Pilot Run (özellikle kampanya projelerinde, üretime geçişten sonra lansman öncesi). Genel koordinasyon PM'e aittir."},
{t:"PM",q:"'Proje Performans Değerlendirme Süreci' ne zaman başlatılır?",opts:["Proje planı onaylandıktan hemen sonra","Jira'da proje kapatıldıktan sonra, kapanış adımının bir parçası olarak","Devreye alım tamamlandıktan hemen sonra","Talep olgunlaştırma aşamasında"],a:1,exp:"Proje kapanış adımları sırasıyla: Talep sahibi/Sponsor ve OFL ile mutabık kalınır → Proje Kapanış Maili gönderilir → Alınan Dersler (Lessons Learned) Toplantısı yapılır → Jira'da proje kapatılır → Proje Performans Değerlendirme Süreci başlatılır."},
{t:"PM",q:"Yönlendirme Komitesi (Steering Committee) hangi durumlarda devreye girer?",opts:["Her haftalık durum raporunda otomatik olarak","Projenin kapsamını veya zaman planını etkileyen değişiklikler, riskler veya paydaşlar arası ihtilaflar söz konusu olduğunda","Yalnızca proje bütçesi aşıldığında","Tedarikçi sözleşmesi imzalanmadan önce"],a:1,exp:"Yönlendirme Komitesi, üç temel durumda devreye girer: (1) Kapsam/zaman planını etkileyen değişiklikler (iş önceliklerinin değişmesi gibi), (2) Yüksek risk değerlendirmeleri, (3) Paydaşlar arasında çözülemeyen ihtilaflı konular (organizasyon ya da süreç değişiklikleri gibi)."},
{t:"PM",q:"'Project & Portfolio Review' toplantısı neyi kapsar ve hangi sıklıkta yapılır?",opts:["Tek bir projenin detaylarını; aylık","ICT'deki tüm proje portföyünü; division bazında belli periyotlarda","Yalnızca riskli projeleri; acil durumlarda","Tamamlanmış projelerin değerlendirmesini; yıllık"],a:1,exp:"P&P Review toplantıları, ICT içinde division bazında, DH ve yönetim ekibinin katılımıyla belli periyotlarda yapılır. Tüm portföydeki projeler değerlendirilir; gecikmeli veya sarı/kırmızı bayraklı projeler sorgulanır, çözüm yolları belirlenir."},
{t:"PM",q:"Proje sürecindeki 'CAB (Change Advisory Board)' toplantısı neyle ilgilidir?",opts:["Proje kapsamı değişikliğini onaylayan komite","Devreye alım planının incelendiği ve canlı ortama geçiş izninin verildiği toplantı","Tedarikçi seçim süreci değerlendirmesi","Bütçe revizyonlarının onaylandığı yönetim kurulu"],a:1,exp:"CAB toplantısı devreye alım öncesinde gerçekleşir. Devreye alım planının hazır olması zorunludur. OFL, CAB'a mutlaka katılmalıdır. Toplantıda canlı ortama geçiş için teknik ve operasyonel hazırlık değerlendirilir ve GO/NO-GO kararı verilir."},
{t:"PM",q:"'Baby Sitting (İzleme) Dönemi' nedir ve proje süresinin yüzde kaçı olarak planlanır?",opts:["Analiz sonrası geliştirme öncesi bekleme süresi; %5","Lansman sonrası ürünün istendiği gibi çalıştığının kontrol edildiği süre; %15","UAT öncesi hazırlık süresi; %10","Pilot run sonrası stabilizasyon süresi; %20"],a:1,exp:"İzleme (Baby Sitting) dönemi, lansman/devreye alım sonrasında başlar. Proje çıktısının doğru çalışıp çalışmadığı izlenir; hata varsa SLA'lere uyularak düzeltilir. Başlangıçta proje süresinin %15'i olarak planlanır. Uzatmak için ilgili yöneticilerden onay alınması gerekir."},
{t:"PM",q:"Proje organizasyon şemasında 'AFL' ne anlama gelir ve hangi ekibi temsil eder?",opts:["Analiz Faz Lideri; analiz ekiplerinin yöneticisi","Aktif Fonksiyon Liderliği; genel yönetim birimi","Altyapı Faz Liderliği; sunucu ekibi","Analist Fonksiyon Liderliği; test ekibi"],a:0,exp:"AFL = Analiz Faz Lideri. Proje organizasyonunda PM'in altında yer alır ve analiz ekiplerinden sorumludur. Benzer şekilde DFL (Geliştirme Faz Lideri) ve OFL (Operasyon Faz Lideri) de kendi ekiplerinden sorumludur."},
{t:"PM",q:"Proje Statü Raporu ortalama ne sıklıkla yayınlanmalıdır?",opts:["Her gün","Haftada bir","2 haftada bir (ancak proje durumuna göre değişebilir)","Ayda bir"],a:2,exp:"Proje Statü Raporu projenin mevcut durumunu paydaşlarla paylaşmak için kullanılır. Ortalama 2 haftada bir yayınlanması beklenir; ancak yayınlanma periyodu projenin kritikliğine ve durumuna göre öne çekilebilir."},
{t:"ERP",q:"SAP'de unit testlerin 'DURATION SHORT' olarak tanımlanmasının sebebi nedir?",opts:["Testin yalnızca kısa kod satırlarını kapsayacağını belirtir","Testin beklenen çalışma süresinin kısa olduğunu SAP'ye bildirir","Testin production ortamında çalışmasını engeller","Test başarısız olduğunda kısa hata mesajı görüntülenmesini sağlar"],a:1,exp:"DURATION SHORT/MEDIUM/LONG, testin ne kadar süreceğini SAP sistemine bildirir. SHORT = saniyeler, MEDIUM = dakikalar, LONG = uzun süre. Bu bilgi, test altyapısının kaynak planlaması için kullanılır."},
{t:"ERP",q:"Playwright'ın geleneksel Selenium'a kıyasla öne çıkan avantajları arasında hangisi yer almaz?",opts:["AI destekli test otomasyona uyumluluk","Zengin debug araçları (trace viewer, video kaydı)","Sadece JavaScript dilini destekleme","Sıfır maliyet (açık kaynak)"],a:2,exp:"Playwright çoklu dil desteği sunar: TypeScript/JavaScript, Python ve Java. Bu nedenle 'sadece JS destekler' yanlış bir ifadedir. Diğer avantajları gerçektir: AI entegrasyonu, trace viewer, sıfır maliyet ve CI/CD uyumluluğu."},
{t:"ERP",q:"SAP test otomasyonunda kullanılan araçlar arasında SAP'nin kendi geliştirdiği araç hangisidir?",opts:["Tricentis Tosca","Selenium","SAP Solution Manager ve eCATT","IBM Rational Functional Tester"],a:2,exp:"SAP'nin kendi bünyesinde geliştirdiği test araçları: SAP Solution Manager (proje ve test yönetimi platformu) ve eCATT (Extended Computer Aided Test Tool). Diğerleri üçüncü taraf araçlardır; ancak SAP ile iyi entegre çalışırlar."},
{t:"ERP",q:"ABAP Unit testinde 'cl_abap_unit_assert=>fail()' metodu ne zaman kullanılır?",opts:["Test başarıyla tamamlandığında sonucu loglamak için","Beklenmeyen bir durumla karşılaşıldığında testi açıkça başarısız saymak için","Testin atlanmasını sağlamak için","Karşılaştırma yetersiz olduğunda varsayılan sonuç üretmek için"],a:1,exp:"fail() metodu, bir koşulun kendisi için özel bir assert metodu yokken testi açıkça başarısız yapmak için kullanılır. Örneğin bir exception bekliyorsunuz ama fırlatılmadıysa fail() çağrılabilir. assert_equals, assert_initial vb. ile aynı ailede yer alır."},
{t:"ERP",q:"SAP Fiori'nin SAPUI5 ile ilişkisi nedir?",opts:["SAP Fiori ve SAPUI5 birbirinden bağımsız iki ayrı üründür","SAPUI5, Fiori uygulamalarının üzerine inşa edildiği JavaScript UI çerçevesidir","Fiori, SAPUI5'i tamamen gereksiz kılmıştır","SAPUI5 yalnızca mobil uygulamalar için kullanılır"],a:1,exp:"SAPUI5, SAP'nin geliştirdiği JavaScript/HTML5 tabanlı UI çerçevesidir (framework). SAP Fiori ise bu çerçeve üzerine inşa edilmiş, kullanıcı deneyimi tasarım ilkeleri ve uygulama kataloğunu kapsayan daha geniş bir kavramdır."},
{t:"PM",q:"Turkcell proje sürecinde 'Kısmi Lansman' ne anlama gelir ve her kısmi lansman için ne gerekir?",opts:["Projenin müşteri kesimine göre bölümlenerek yapılan lansman; ek onay gerekmez","Müşteriye değer ifade eden birden fazla devreye alım; her biri için Deployment Approval alınması gerekir","Ürünün yalnızca bir coğrafi bölgede yayınlanması; merkezi onay yeterlidir","Pilot kullanıcılara özel erken erişim lansmanı; test ekibi onayı yeterlidir"],a:1,exp:"Kısmi Lansman: proje kapsamında müşteriye değer yaratan birden fazla devreye alım varsa bunlar proje planında kısmi lansman olarak gösterilir. Her kısmi lansman için: devreye alım planı gözden geçirilir, gerekirse revize edilir ve talep sahibinden 'Deployment Approval' onayı alınması zorunludur."},
{t:"PM",q:"Proje sürecinde 'Talep sahibi' ve 'Proje Sponsoru' rolleri arasındaki temel fark nedir?",opts:["İkisi aynı kişidir; farklı bağlamlarda kullanılan eş anlamlı terimlerdir","Talep sahibi ihtiyacı oluşturandır; sponsor ise proje çıktısından faydalanacak birimin yöneticisidir (min. DH)","Sponsor teknik kararları, talep sahibi iş kararlarını alır","Talep sahibi dış müşteri, sponsor ise iç müşteridir"],a:1,exp:"Talep Sahibi: ihtiyacı bildiren ve UAT'ı yapan kişidir. Proje Sponsoru: proje çıktısından faydalanacak iş biriminin yöneticisidir ve en az DH (Departman Başkanı) seviyesinde olmalıdır. Sponsor; kapsam onayı, risk yönetimi ve Deployment Approval gibi kritik kararları verir."},
{t:"PM",q:"Proje planında 'iyi bir proje planının cevapladığı sorular' arasında hangisi yer almaz?",opts:["Hangi aktiviteleri yaparız?","Hangi sırada yaparız?","Proje ne kadar kâr sağlayacak?","Tüm iş ne kadar sürede tamamlanır?"],a:2,exp:"İyi bir proje planı şu soruları yanıtlar: Hangi aktiviteleri yaparız? Hangi sırada? Hangi sürede? Kimler yapar? Tüm iş ne kadar sürer? — 'Proje ne kadar kâr sağlayacak?' bir proje planının değil, iş gereksinimi veya talep olgunlaştırma dokümanının konusudur."},
{t:"PM",q:"Turkcell proje sürecinde 'PEC (Phase Exit Checks)' nedir?",opts:["Proje kapanış ekibi kontrol listesi","Her faz sonunda SOX, prosedür ve kalite onaylarının eksiksizliğini kontrol eden 119 maddelik liste","Proje açılışı öncesi teknik hazırlık formu","Tedarikçi değerlendirme kriterleri listesi"],a:1,exp:"PEC (Phase Exit Checks), her faz sonunda PM tarafından doldurulan kontrol listesidir. SOX uyumluluk, prosedür onayları ve kalite belgelerinin eksiksiz olmasını güvence altına alır. PM, AFL, I-LEAD ve OFL tarafından birlikte doldurulur ve 119 maddeden oluşur."},
{t:"PM",q:"Projede risk değerlendirme tablosunda 'Kırmızı' bölge neyi ifade eder?",opts:["Düşük olasılık ve düşük etki","Yüksek olasılık ve yüksek etki; acil eskalasyon gerektiren durum","Sadece yüksek etki; olasılıktan bağımsız","Teknik ekip tarafından çözülmesi gereken yazılım hataları"],a:1,exp:"Risk matrisi: Olasılık (dikey eksen) × Etki (yatay eksen). Kırmızı bölge = yüksek olasılık + yüksek etki kombinasyonu. Bu durumda risk eskale edilir, gerekirse proje dondurulur veya iptal edilir. Sarı = orta risk, Yeşil = düşük risk."},
{t:"PM",q:"Proje Statü Raporu'nun 'Acil/Kritik Aksiyonlar' bölümü ne amaçla kullanılır?",opts:["Proje bütçe özetini göstermek için","Tüm ekip üyelerinin görevlerini listelemek için","Paydaşların hızlıca fark etmesi gereken gecikme, risk veya eskalasyon gerektiren kritik konuları öne çıkarmak için","Geçmiş statü raporlarından farklılıkları göstermek için"],a:2,exp:"Statü Raporundaki 'Acil/Kritik Aksiyonlar' bölümü, yöneticilerin ve paydaşların hızla dikkat etmesi gereken konuları öne çıkarır: gecikme riski taşıyan aktiviteler, eskalasyon bekleyen kararlar, acil kaynak ihtiyaçları vb. Aksiyon yoksa 'Acil, kritik aksiyonumuz bulunmamaktadır' yazılır."},
{t:"ERP",q:"SAP'de regresyon testi (regression testing) neden önemlidir?",opts:["İlk kez yazılan kodları test etmek için kullanılır","Bir değişikliğin önceden çalışan işlevlerin bozulmadığını doğrulamak için yapılır","Yalnızca kullanıcı arayüzünü test etmek için kullanılır","Performans sorunlarını tespit etmek için kullanılır"],a:1,exp:"Regresyon testi, yeni bir geliştirme veya değişiklikten sonra sistemin daha önce doğru çalışan fonksiyonlarının hâlâ düzgün çalıştığını doğrular. SAP'de özellikle Z geliştirmeler, sistem güncellemeleri veya yasal değişiklikler sonrası kritik önem taşır."},
{t:"ERP",q:"ABAP Unit test sonuçlarında 'Statement Coverage %100' ne anlama gelir?",opts:["Tüm test senaryoları başarıyla geçildi","Test edilen kodun tüm satırları en az bir kez çalıştırıldı","Test dosyası eksiksiz tamamlandı","Sistem yüzde yüz kararlı çalışıyor"],a:1,exp:"Statement Coverage (ifade kapsama), test sırasında üretim kodundaki kaç satırın/ifadenin çalıştırıldığını gösterir. %100 = tüm kod satırları en az bir kez test edildi. Eclipse'deki ABAP Unit sonuç ekranında görüntülenir. Yüksek kapsama oranı, test kalitesinin önemli bir göstergesidir."},
{t:"PM",q:"Proje sürecinde analistin temel sorumluluğu nedir?",opts:["Geliştirme kodlarını yazmak ve test senaryolarını hazırlamak","Projenin iş ihtiyacı için analitik ve mimari çözüm bilgisini üretmek","Operasyonel kontrolleri koordine etmek","Proje bütçesini yönetmek ve tedarikçilerle sözleşme yapmak"],a:1,exp:"Analiz ekibi, iş ihtiyacının teknik çözüme dönüştürülmesinden sorumludur. Çıktısı analiz dokümanıdır. Fraud, Security ve Operasyon gibi paydaşların kısıt ve taleplerini analize yansıtır. AD Review ve TTD Review toplantılarına müşteri onaylarıyla hazırlanarak gelir."},
{t:"PM",q:"Proje kapanış sürecinde 'Alınan Dersler (Lessons Learned)' toplantısının amacı nedir?",opts:["Proje ekibinin performansını değerlendirerek ödül vermek","Proje boyunca yaşanan sorunları, başarıları ve geliştirme önerilerini belgeleyerek gelecek projelere katkı sağlamak","Proje yöneticisinin bir sonraki projesini planlamak","Tedarikçilerle sözleşme yenilemesi müzakeresi yapmak"],a:1,exp:"Lessons Learned toplantısı, proje kapanışının kritik bir adımıdır. Neyin iyi gittiği, neyin kötü gittiği ve bir dahaki seferde neler yapılabileceği değerlendirilir. Bu bilgi kurumsal hafızaya aktarılarak organizasyonun proje yönetimi olgunluğunun artırılmasına katkı sağlar."},
];

let current=0,correct=0,wrong=0,answered=false,wrongs=[];

function render(){
  const q=Qs[current];
  const area=document.getElementById('q-area');
  area.innerHTML=`
<div class="q-card">
  <div class="q-meta">
    <span class="badge ${q.t==='ERP'?'b-erp':'b-pm'}">${q.t==='ERP'?'ERP & SAP':'Proje Yönetimi'}</span>
    <span style="color:var(--color-text-tertiary)">Soru ${current+1} / ${Qs.length}</span>
  </div>
  <div class="q-text">${q.q}</div>
  <div class="options" id="opts">
    ${q.opts.map((o,i)=>`<div class="opt" id="opt${i}" onclick="pick(${i})">
      <div class="opt-letter">${'ABCD'[i]}</div>
      <div class="opt-text">${o}</div>
    </div>`).join('')}
  </div>
  <div class="explanation" id="exp">${q.exp}</div>
</div>
<div class="btn-row">
  <button class="btn" onclick="skipQ()" id="skip-btn" style="color:var(--color-text-secondary)">Geç →</button>
</div>`;
  updateStats();
}

function pick(i){
  if(answered)return;
  answered=true;
  const q=Qs[current];
  const opts=document.querySelectorAll('.opt');
  opts.forEach((o,idx)=>{
    if(idx===q.a) o.classList.add('correct');
    else if(idx===i && i!==q.a) o.classList.add('wrong');
    o.style.cursor='default';
  });
  document.getElementById('exp').classList.add('show');
  if(i===q.a){correct++;}
  else{wrong++;wrongs.push({q:q.q,correct:q.opts[q.a],exp:q.exp});}
  updateStats();
  const skipBtn=document.getElementById('skip-btn');
  if(skipBtn){skipBtn.textContent=current<Qs.length-1?'Sonraki soru →':'Sonuçları gör →';skipBtn.style.color='';}
}

function skipQ(){
  if(current<Qs.length-1){current++;answered=false;render();}
  else{showResult();}
}

function updateStats(){
  const done=correct+wrong;
  document.getElementById('s-done').textContent=done;
  document.getElementById('s-correct').textContent=correct;
  document.getElementById('s-wrong').textContent=wrong;
  document.getElementById('s-pct').textContent=done>0?Math.round(correct/done*100)+'%':'-';
  document.getElementById('pbar').style.width=((current+1)/Qs.length*100)+'%';
  document.getElementById('q-counter').textContent=`Soru ${current+1} / ${Qs.length} · ${answered?'Açıklamayı oku, sonra devam et':'Bir seçenek seç'}`;
}

function showResult(){
  document.getElementById('q-area').style.display='none';
  const rc=document.getElementById('result-card');
  rc.style.display='block';
  const pct=Math.round(correct/Qs.length*100);
  document.getElementById('r-score').textContent=pct+'%';
  let msg='';
  if(pct>=90)msg='Harika! Finali geçmeye hazırsın. 🎉';
  else if(pct>=75)msg='Çok iyi! Eksik konuları bir kez daha gözden geçir.';
  else if(pct>=60)msg='Ortalama. Aşağıdaki yanlışlarına odaklan.';
  else msg='Daha fazla çalışma gerekiyor. Notları yeniden oku.';
  document.getElementById('r-msg').textContent=`${correct} / ${Qs.length} doğru — ${msg}`;
  const wl=document.getElementById('r-wrongs');
  if(wrongs.length>0){
    wl.innerHTML='<div style="font-weight:500;font-size:14px;margin-bottom:12px;color:var(--color-text-primary)">Yanlış cevapladığın sorular:</div>'+
    wrongs.map(w=>`<div class="wrong-item"><strong>${w.q}</strong>Doğru cevap: ${w.correct}<br><span style="color:var(--color-text-tertiary);font-size:12px">${w.exp}</span></div>`).join('');
  }
}

function restart(){
  current=0;correct=0;wrong=0;answered=false;wrongs=[];
  document.getElementById('result-card').style.display='none';
  document.getElementById('q-area').style.display='block';
  render();
}

render();
</script>
